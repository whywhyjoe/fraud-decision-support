<!--
  Fraud call guide: the whole content of the page's script web part.
  Generated per environment by tools/render-webpart.mjs from environments.json
  into app/fraud-guide.webpart.html (gitignored). Do not hand-edit tokens here.

  The data-* attributes are defaults, used only while the page's own columns
  (Script, Config, Ver, DisplayName, Value1) are empty. Set the columns and
  the page needs no further edits; change data-fullpage to "none" to keep
  the SharePoint chrome.
-->
<div data-fraud-guide
     data-script="{{SCRIPT}}"
     data-config="{{CONFIG}}"
     data-version="{{VER}}"
     data-display-name="{{DISPLAY_NAME}}"
     data-fullpage="webview"></div>
<script src="{{BOOT_URL}}"></script>
