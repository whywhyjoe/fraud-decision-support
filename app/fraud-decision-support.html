<div id="app" data-role="shell"></div>

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------- */
  /* Data                                                        */
  /* ---------------------------------------------------------- */
  var FLOW = JSON.parse(document.getElementById('flow-data').textContent);
  var NODES = {};
  FLOW.nodes.forEach(function (n) { NODES[n.id] = n; });
  var STAGES = FLOW.stages.slice().sort(function (a, b) { return a.order - b.order; });
  var STAGE = {};
  STAGES.forEach(function (s) { STAGE[s.id] = s; });

  /* UI chrome strings. Not scenario content — but kept in one table so the
     render functions contain no literals and a designer can retitle things. */
  var UI_TEXT = {
    appTitle: 'Fraud call guide',
    wireframeTag: 'wireframe',
    modeLive: 'Live',
    modeTraining: 'Training',
    searchPlaceholder: 'Jump to… (type a keyword, Enter)',
    searchNoResults: 'No node matches',
    noteButton: 'Call note',
    debugButton: 'Debug',
    resetButton: 'Start over',
    breadcrumbLabel: 'Path taken',
    contextLabel: 'Captured facts',
    unresolvedLabel: 'Unresolved:',
    returnTo: 'Return',
    stageOf: 'Stage {n} of {total}',
    riskLabel: { low: 'Low risk', elevated: 'Elevated risk', critical: 'Critical — read the right-hand panel before speaking' },
    previouslyChosen: 'previously chosen',
    exitNa: 'Not applicable',
    exitOffScript: 'Customer went off-script',
    exitPark: "I don't know yet",
    lateralButton: 'Jump to another answer in this stage',
    lateralTitle: 'Jump within the stage',
    lateralHint: 'The path is kept; the jump is marked in the breadcrumb.',
    lateralCurrent: 'you are here',
    flagButton: 'Flag this node',
    flagTitle: 'Flag this node',
    flagKinds: { wrong: 'This is wrong', unclear: 'This is unclear', missing: 'Missing a resource' },
    flagCommentPlaceholder: 'Optional: what would you change?',
    flagSubmit: 'Add flag',
    flagCancel: 'Cancel',
    close: 'Close',
    terminalTitle: 'End of call',
    terminalHint: 'Generate the call note, then start over for the next call.',
    whyTitle: 'Why this matters',
    dialogueTitle: 'Sample dialogue',
    railTitle: 'For this node',
    railEmpty: 'No guidance authored for this node yet.',
    groups: { ask: 'Ask', watch: 'Watch for', never: 'Never say', escalate: 'Escalate if', resource: 'Resources' },
    staleNotice: '{n} later step{s} no longer appl{y}',
    staleDetail: 'You changed the answer at step {n}. The old steps are kept, struck through, until you undo or dismiss.',
    staleUndo: 'Undo',
    staleDismiss: 'Dismiss',
    staleGroup: 'No longer apply:',
    chipTags: { lateral: 'jumped', search: 'searched', 'exit-na': 'n/a', 'exit-offscript': 'off-script', park: 'parked', return: 'returned' },
    chipStatus: { unresolved: 'unresolved', skipped: 'jumped away', 'resolved-later': 'resolved later', exit: '' },
    chipExit: { na: 'not applicable', offscript: 'off-script' },
    noteTitle: 'Call note',
    noteCopy: 'Copy',
    noteCopied: 'Copied',
    noteRegenerate: 'Regenerate',
    debugTitle: 'Debug',
    debugState: 'Current state',
    debugFlags: 'Flagged nodes',
    debugFlagsEmpty: 'Nothing flagged yet.',
    debugLog: 'Event log',
    debugCounts: { visit: 'visits', lateral: 'lateral jumps', rewind: 'rewinds', stale: 'invalidations', park: 'parked', flag: 'flags' },
    footerKeys: 'Keys: 1–9 choose an answer · / search · Esc close panels',
    footerVersion: 'Content {v}'
  };

  /* ---------------------------------------------------------- */
  /* State                                                       */
  /* ---------------------------------------------------------- */
  var state = initialState();

  function initialState() {
    return {
      mode: 'live',
      path: [{ nodeId: FLOW.startNodeId, arrivedVia: 'start', answer: null, status: 'open', exit: null }],
      cursor: 0,
      stale: null,
      context: {},
      unresolved: [],
      flags: [],
      log: [],
      ui: { lateralOpen: false, lateralStage: null, flagOpen: false, noteOpen: false, noteCopied: false,
            debugOpen: false, search: '', searchOpen: false, freshNode: true }
    };
  }

  function currentStep() { return state.path[state.cursor]; }
  function currentNode() { return NODES[currentStep().nodeId]; }
  function stageOf(node) { return STAGE[node.stageId]; }

  function logEvent(type, detail) {
    state.log.push({ at: new Date().toISOString(), type: type, detail: detail || {} });
  }

  function snapshot() {
    return JSON.parse(JSON.stringify({ path: state.path, cursor: state.cursor, context: state.context, unresolved: state.unresolved }));
  }

  /* If the rep is positioned before the end of the path, any forward move
     invalidates the steps after the cursor. They are kept as stale, not lost. */
  function invalidateDownstream(reason) {
    if (state.cursor >= state.path.length - 1) return;
    var snap = snapshot();
    var dropped = state.path.slice(state.cursor + 1);
    state.path = state.path.slice(0, state.cursor + 1);
    state.stale = { steps: dropped, changedAt: state.cursor, reason: reason, snapshot: snap };
    logEvent('stale', { changedAt: state.cursor + 1, dropped: dropped.length, reason: reason });
  }

  function applyContext(setsContext) {
    if (!setsContext) return;
    Object.keys(setsContext).forEach(function (k) { state.context[k] = setsContext[k]; });
  }

  function moveTo(nodeId, via) {
    state.path.push({ nodeId: nodeId, arrivedVia: via, answer: null, status: 'open', exit: null });
    state.cursor = state.path.length - 1;
    state.ui.lateralOpen = false; state.ui.flagOpen = false; state.ui.searchOpen = false; state.ui.search = '';
    state.ui.freshNode = true;
    logEvent('visit', { nodeId: nodeId, via: via, step: state.cursor + 1 });
  }

  function markResolvedLater(nodeId) {
    state.path.forEach(function (s) { if (s.nodeId === nodeId && s.status === 'unresolved') s.status = 'resolved-later'; });
    state.unresolved = state.unresolved.filter(function (id) { return id !== nodeId; });
  }

  /* ---------------------------------------------------------- */
  /* Reducer: every state change goes through here, then render  */
  /* ---------------------------------------------------------- */
  function dispatch(action) {
    var step = currentStep();
    var node = currentNode();
    var stage = stageOf(node);
    state.ui.freshNode = false;

    switch (action.type) {

      case 'answer': {
        var answer = node.answers[action.index];
        if (!answer) break;
        if (state.cursor < state.path.length - 1 && step.answer === answer.label) {
          // Same answer as before: walk forward along the existing path.
          state.cursor += 1;
          state.ui.freshNode = true;
          logEvent('rewind-forward', { step: state.cursor + 1 });
          break;
        }
        invalidateDownstream('answer-changed');
        step.answer = answer.label; step.status = 'answered'; step.exit = null;
        markResolvedLater(node.id);
        applyContext(answer.setsContext);
        logEvent('answer', { nodeId: node.id, answer: answer.label });
        moveTo(answer.nextNodeId, 'answer');
        break;
      }

      case 'exit': {
        invalidateDownstream('exit');
        var next;
        if (action.exit === 'na') {
          step.status = 'exit'; step.exit = 'na'; step.answer = null;
          next = node.naNextNodeId || stage.naNextNodeId;
          logEvent('exit', { nodeId: node.id, exit: 'na' });
          moveTo(next, 'exit-na');
        } else if (action.exit === 'offscript') {
          step.status = 'exit'; step.exit = 'offscript'; step.answer = null;
          next = stage.offScriptNodeId;
          logEvent('exit', { nodeId: node.id, exit: 'offscript' });
          moveTo(next, 'exit-offscript');
        } else if (action.exit === 'park') {
          step.status = 'unresolved'; step.answer = null;
          if (state.unresolved.indexOf(node.id) < 0) state.unresolved.push(node.id);
          next = node.parkNextNodeId || stage.naNextNodeId;
          logEvent('park', { nodeId: node.id });
          moveTo(next, 'park');
        }
        break;
      }

      case 'lateral': {
        if (action.nodeId === node.id) break;
        invalidateDownstream('lateral');
        if (step.status === 'open') step.status = 'skipped';
        logEvent('lateral', { from: node.id, to: action.nodeId });
        moveTo(action.nodeId, 'lateral');
        break;
      }

      case 'return': {
        invalidateDownstream('return');
        if (step.status === 'open') step.status = 'skipped';
        logEvent('return', { from: node.id, to: action.nodeId });
        moveTo(action.nodeId, 'return');
        break;
      }

      case 'search-jump': {
        invalidateDownstream('search');
        if (step.status === 'open') step.status = 'skipped';
        logEvent('search-jump', { from: node.id, to: action.nodeId, query: state.ui.search });
        moveTo(action.nodeId, 'search');
        break;
      }

      case 'rewind': {
        if (action.index === state.cursor || action.index < 0 || action.index >= state.path.length) break;
        logEvent('rewind', { from: state.cursor + 1, to: action.index + 1 });
        state.cursor = action.index;
        state.ui.lateralOpen = false; state.ui.flagOpen = false;
        state.ui.freshNode = true;
        break;
      }

      case 'undo-stale': {
        if (!state.stale) break;
        var snap = state.stale.snapshot;
        state.path = snap.path; state.cursor = snap.cursor; state.context = snap.context; state.unresolved = snap.unresolved;
        state.stale = null;
        state.ui.freshNode = true;
        logEvent('undo', { restoredTo: state.cursor + 1 });
        break;
      }

      case 'dismiss-stale': {
        if (!state.stale) break;
        logEvent('stale-dismissed', { dropped: state.stale.steps.length });
        state.stale = null;
        break;
      }

      case 'set-context': {
        state.context[action.key] = action.value;
        logEvent('context', { key: action.key, value: action.value });
        break;
      }

      case 'set-mode': {
        if (state.mode === action.mode) break;
        state.mode = action.mode;
        logEvent('mode', { mode: action.mode });
        break;
      }

      case 'toggle-lateral': {
        state.ui.lateralOpen = !state.ui.lateralOpen;
        state.ui.lateralStage = node.stageId;
        state.ui.flagOpen = false;
        break;
      }
      case 'lateral-stage': { state.ui.lateralStage = action.stageId; break; }

      case 'toggle-flag': { state.ui.flagOpen = !state.ui.flagOpen; state.ui.lateralOpen = false; break; }
      case 'submit-flag': {
        state.flags.push({ id: state.flags.length + 1, nodeId: node.id, kind: action.kind, comment: action.comment, at: new Date().toISOString(), mode: state.mode });
        state.ui.flagOpen = false;
        logEvent('flag', { nodeId: node.id, kind: action.kind });
        break;
      }

      case 'search': { state.ui.search = action.value; state.ui.searchOpen = action.value.trim().length > 0; break; }
      case 'close-search': { state.ui.searchOpen = false; break; }

      case 'toggle-note': {
        state.ui.noteOpen = !state.ui.noteOpen; state.ui.noteCopied = false;
        if (state.ui.noteOpen) logEvent('note', { steps: state.path.length });
        break;
      }
      case 'note-copied': { state.ui.noteCopied = true; break; }
      case 'toggle-debug': { state.ui.debugOpen = !state.ui.debugOpen; break; }

      case 'close-panels': {
        state.ui.lateralOpen = false; state.ui.flagOpen = false; state.ui.searchOpen = false;
        break;
      }

      case 'reset': {
        var keep = { mode: state.mode, flags: state.flags, log: state.log };
        state = initialState();
        state.mode = keep.mode; state.flags = keep.flags; state.log = keep.log;
        logEvent('reset', {});
        break;
      }
    }
    render();
  }

  /* ---------------------------------------------------------- */
  /* Derived                                                     */
  /* ---------------------------------------------------------- */
  function searchNodes(query) {
    var q = query.trim().toLowerCase();
    if (!q) return [];
    return FLOW.nodes.filter(function (n) {
      var hay = [n.label, n.prompt, STAGE[n.stageId].label].concat(n.content.map(function (c) { return c.text; })).join(' ').toLowerCase();
      return hay.indexOf(q) >= 0;
    }).slice(0, 12);
  }

  function pathLine(step, i) {
    var n = NODES[step.nodeId];
    var s = STAGE[n.stageId];
    var how = '';
    if (step.arrivedVia === 'lateral') how = ' [lateral jump]';
    else if (step.arrivedVia === 'search') how = ' [keyword jump]';
    else if (step.arrivedVia === 'return') how = ' [returned to unresolved]';
    var outcome;
    if (step.status === 'answered') outcome = step.answer;
    else if (step.status === 'unresolved') outcome = 'UNRESOLVED (rep did not know yet)';
    else if (step.status === 'resolved-later') outcome = 'left unresolved, resolved later';
    else if (step.status === 'skipped') outcome = 'no answer recorded (jumped away)';
    else if (step.status === 'exit') outcome = step.exit === 'na' ? 'not applicable' : 'customer went off-script';
    else if (n.terminal) outcome = 'END';
    else outcome = 'in progress';
    return (i + 1) + '. [' + s.label + '] ' + n.label + how + ' -> ' + outcome;
  }

  function buildNote() {
    var lines = [];
    lines.push('CASE NOTE (draft) — ' + FLOW.meta.disclaimer);
    lines.push('Scenario: ' + FLOW.meta.scenario);
    lines.push('Generated: ' + new Date().toLocaleString());
    lines.push('');
    lines.push('CAPTURED FACTS');
    FLOW.contextFields.forEach(function (f) {
      var v = state.context[f.key];
      lines.push('- ' + f.label + ': ' + (v ? v : '(not captured)'));
    });
    lines.push('');
    lines.push('PATH TAKEN');
    state.path.forEach(function (step, i) { lines.push(pathLine(step, i)); });
    if (state.stale) {
      lines.push('');
      lines.push('STEPS NO LONGER APPLYING (answer changed at step ' + (state.stale.changedAt + 1) + ')');
      state.stale.steps.forEach(function (step, i) { lines.push('  ' + pathLine(step, state.stale.changedAt + 1 + i)); });
    }
    if (state.unresolved.length) {
      lines.push('');
      lines.push('STILL UNRESOLVED');
      state.unresolved.forEach(function (id) { lines.push('- ' + NODES[id].label + ': ' + NODES[id].prompt); });
    }
    var critical = state.path.filter(function (s) { return NODES[s.nodeId].risk === 'critical'; });
    if (critical.length) {
      lines.push('');
      lines.push('CRITICAL-RISK NODES VISITED');
      critical.forEach(function (s) { lines.push('- ' + NODES[s.nodeId].label); });
    }
    var flagsHere = state.flags.length;
    if (flagsHere) { lines.push(''); lines.push('Content flags raised during this call: ' + flagsHere + ' (see debug screen)'); }
    return lines.join('\n');
  }

  function counts() {
    var c = { visit: 0, lateral: 0, rewind: 0, stale: 0, park: 0, flag: 0 };
    state.log.forEach(function (e) { if (c.hasOwnProperty(e.type)) c[e.type] += 1; });
    return c;
  }

  /* ---------------------------------------------------------- */
  /* Render: state in, DOM out. One call per dispatch.           */
  /* ---------------------------------------------------------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(tpl, vars) { return tpl.replace(/\{(\w+)\}/g, function (_, k) { return vars[k] != null ? vars[k] : ''; }); }
  function attr(name, v) { return v == null || v === false ? '' : ' ' + name + '="' + esc(v) + '"'; }

  function render() {
    var root = document.getElementById('app');
    var focus = captureFocus();
    root.innerHTML = renderTopBar() + renderMain() + renderRail() + renderFooter();
    restoreFocus(focus);
  }

  function captureFocus() {
    var el = document.activeElement;
    if (!el || !el.getAttribute) return null;
    var key = el.getAttribute('data-focus-key');
    if (!key) return null;
    return { key: key, start: el.selectionStart, end: el.selectionEnd };
  }
  function restoreFocus(f) {
    if (!f) return;
    var el = document.querySelector('[data-focus-key="' + f.key + '"]');
    if (!el) return;
    el.focus();
    if (typeof f.start === 'number' && el.setSelectionRange) { try { el.setSelectionRange(f.start, f.end); } catch (e) {} }
  }

  /* ---- top bar ---- */
  function renderTopBar() {
    return '<header class="panel" data-role="top-bar">' +
      renderHeaderRow() +
      renderBreadcrumb() +
      renderStaleNotice() +
      renderContextStrip() +
      renderUnresolvedTray() +
      '</header>';
  }

  function renderHeaderRow() {
    var h = '<div data-role="app-header">';
    h += '<h1>' + esc(UI_TEXT.appTitle) + ' <span class="tag">' + esc(UI_TEXT.wireframeTag) + '</span> <span class="small muted">' + esc(FLOW.meta.scenario) + '</span></h1>';
    h += renderSearch();
    h += '<div data-role="mode-toggle" role="group">' +
      '<button type="button" data-action="set-mode" data-mode="live"' + attr('aria-pressed', state.mode === 'live' ? 'true' : 'false') + '>' + esc(UI_TEXT.modeLive) + '</button>' +
      '<button type="button" data-action="set-mode" data-mode="training"' + attr('aria-pressed', state.mode === 'training' ? 'true' : 'false') + '>' + esc(UI_TEXT.modeTraining) + '</button>' +
      '</div>';
    h += '<button type="button" data-action="toggle-note" data-role="note-button"' + attr('aria-pressed', state.ui.noteOpen ? 'true' : 'false') + '>' + esc(UI_TEXT.noteButton) + '</button>';
    h += '<button type="button" data-action="toggle-debug" data-role="debug-button"' + attr('aria-pressed', state.ui.debugOpen ? 'true' : 'false') + '>' + esc(UI_TEXT.debugButton) + (state.flags.length ? ' (' + state.flags.length + ')' : '') + '</button>';
    h += '<button type="button" class="btn-quiet" data-action="reset" data-role="reset-button">' + esc(UI_TEXT.resetButton) + '</button>';
    h += '</div>';
    return h;
  }

  function renderSearch() {
    var results = state.ui.searchOpen ? searchNodes(state.ui.search) : [];
    var h = '<div data-role="search" role="search">';
    h += '<input type="search" data-role="search-input" data-focus-key="search" autocomplete="off"' +
      attr('placeholder', UI_TEXT.searchPlaceholder) + attr('value', state.ui.search) + attr('aria-expanded', state.ui.searchOpen ? 'true' : 'false') + '>';
    if (state.ui.searchOpen) {
      h += '<ul data-role="search-results">';
      if (!results.length) h += '<li><span class="search-empty">' + esc(UI_TEXT.searchNoResults) + '</span></li>';
      results.forEach(function (n) {
        h += '<li><button type="button" data-action="search-jump" data-role="search-result"' + attr('data-node-id', n.id) + '>' +
          '<span class="tag">' + esc(STAGE[n.stageId].label) + '</span> <strong>' + esc(n.label) + '</strong><br><span class="small muted">' + esc(n.prompt) + '</span></button></li>';
      });
      h += '</ul>';
    }
    h += '</div>';
    return h;
  }

  function renderChip(step, i, stateName) {
    var n = NODES[step.nodeId];
    var tag = UI_TEXT.chipTags[step.arrivedVia];
    var line2 = '';
    if (step.status === 'answered') line2 = '→ ' + step.answer;
    else if (step.status === 'exit') line2 = '→ ' + UI_TEXT.chipExit[step.exit];
    else if (UI_TEXT.chipStatus[step.status]) line2 = UI_TEXT.chipStatus[step.status];
    var h = '<li>';
    h += '<button type="button" data-role="breadcrumb-chip" data-action="rewind"' + attr('data-index', stateName === 'stale' ? null : i) +
      attr('data-state', stateName) + attr('data-arrived', step.arrivedVia) + attr('data-node-id', n.id) +
      attr('aria-current', stateName === 'current' ? 'step' : null) + (stateName === 'stale' ? ' disabled' : '') + '>';
    h += '<span>' + (i + 1) + '. ' + esc(n.label) + (tag ? ' <span class="tag">' + esc(tag) + '</span>' : '') + '</span>';
    if (line2) h += '<span class="chip-answer">' + esc(line2) + '</span>';
    h += '</button></li>';
    return h;
  }

  function renderBreadcrumb() {
    var h = '<nav aria-label="' + esc(UI_TEXT.breadcrumbLabel) + '"><ol data-role="breadcrumb">';
    state.path.forEach(function (step, i) {
      var st = i === state.cursor ? 'current' : (i > state.cursor ? 'ahead' : 'past');
      h += renderChip(step, i, st);
      if (i < state.path.length - 1) h += '<li class="crumb-sep" aria-hidden="true">›</li>';
    });
    if (state.stale) {
      h += '<li class="crumb-stale-group" data-role="stale-group"><span class="small muted">' + esc(UI_TEXT.staleGroup) + '</span>';
      h += '<ol data-role="breadcrumb" class="crumb-stale-list">';
      state.stale.steps.forEach(function (step, j) { h += renderChip(step, state.stale.changedAt + 1 + j, 'stale'); });
      h += '</ol></li>';
    }
    h += '</ol></nav>';
    return h;
  }

  function renderStaleNotice() {
    if (!state.stale) return '';
    var n = state.stale.steps.length;
    var title = fmt(UI_TEXT.staleNotice, { n: n, s: n === 1 ? '' : 's', y: n === 1 ? 'ies' : 'y' });
    return '<div data-role="stale-notice" role="status">' +
      '<strong>' + esc(title) + '</strong>' +
      '<span class="small">' + esc(fmt(UI_TEXT.staleDetail, { n: state.stale.changedAt + 1 })) + '</span>' +
      '<button type="button" class="btn-primary" data-action="undo-stale" data-role="stale-undo">' + esc(UI_TEXT.staleUndo) + '</button>' +
      '<button type="button" data-action="dismiss-stale" data-role="stale-dismiss">' + esc(UI_TEXT.staleDismiss) + '</button>' +
      '</div>';
  }

  function renderContextStrip() {
    var h = '<section data-role="context-strip" aria-label="' + esc(UI_TEXT.contextLabel) + '">';
    FLOW.contextFields.forEach(function (f) {
      var v = state.context[f.key] || '';
      var id = 'ctx-' + f.key;
      h += '<div data-role="context-field"' + attr('data-key', f.key) + attr('data-set', v ? 'true' : 'false') + '>';
      h += '<label' + attr('for', id) + '>' + esc(f.label) + '</label>';
      if (f.type === 'select') {
        h += '<select' + attr('id', id) + ' data-role="context-input"' + attr('data-key', f.key) + attr('data-focus-key', id) + '>';
        f.options.forEach(function (o) { h += '<option' + attr('value', o) + (o === v ? ' selected' : '') + '>' + esc(o || '—') + '</option>'; });
        h += '</select>';
      } else {
        h += '<input type="text"' + attr('id', id) + ' data-role="context-input"' + attr('data-key', f.key) + attr('data-focus-key', id) + attr('value', v) + '>';
      }
      h += '</div>';
    });
    h += '</section>';
    return h;
  }

  function renderUnresolvedTray() {
    if (!state.unresolved.length) return '';
    var h = '<div data-role="unresolved-tray"><span class="muted">' + esc(UI_TEXT.unresolvedLabel) + '</span>';
    state.unresolved.forEach(function (id) {
      h += '<button type="button" data-action="return" data-role="unresolved-chip"' + attr('data-node-id', id) + '>' + esc(NODES[id].label) + ' · ' + esc(UI_TEXT.returnTo) + '</button>';
    });
    h += '</div>';
    return h;
  }

  /* ---- main ---- */
  function renderMain() {
    var h = '<main data-role="main">';
    h += renderNodeCard();
    if (state.ui.noteOpen) h += renderNotePanel();
    if (state.ui.debugOpen) h += renderDebug();
    h += '</main>';
    return h;
  }

  function renderNodeCard() {
    var step = currentStep();
    var node = currentNode();
    var stage = stageOf(node);
    var idx = STAGES.indexOf(stage);
    var h = '<article class="panel" data-role="node-card"' + attr('data-node-id', node.id) + attr('data-risk', node.risk) + attr('data-fresh', state.ui.freshNode ? 'true' : null) + '>';
    h += '<div class="stage-line"><span class="tag">' + esc(fmt(UI_TEXT.stageOf, { n: idx + 1, total: STAGES.length })) + '</span><strong>' + esc(stage.label) + '</strong><span class="small muted">' + esc(node.label) + '</span></div>';
    if (node.risk) h += '<div data-role="risk-banner"' + attr('data-risk', node.risk) + '>' + esc(UI_TEXT.riskLabel[node.risk]) + '</div>';
    h += '<h2 data-role="prompt">' + esc(node.prompt) + '</h2>';

    if (node.terminal) {
      h += '<div data-role="terminal"><strong>' + esc(UI_TEXT.terminalTitle) + '</strong><p class="small">' + esc(UI_TEXT.terminalHint) + '</p>' +
        '<div class="btn-row"><button type="button" class="btn-primary" data-action="toggle-note">' + esc(UI_TEXT.noteButton) + '</button>' +
        '<button type="button" data-action="reset">' + esc(UI_TEXT.resetButton) + '</button></div></div>';
    } else {
      h += '<ol data-role="answers">';
      node.answers.forEach(function (a, i) {
        var prev = state.cursor < state.path.length - 1 && step.answer === a.label;
        h += '<li><button type="button" data-role="answer-button" data-action="answer"' + attr('data-index', i) + attr('data-previous', prev ? 'true' : null) + '>' +
          '<span class="key" aria-hidden="true">' + (i + 1) + '</span><span>' + esc(a.label) + '</span>' +
          (prev ? '<span class="tag prev">' + esc(UI_TEXT.previouslyChosen) + '</span>' : '') + '</button></li>';
      });
      h += '</ol>';
      h += '<div data-role="exits">';
      h += '<button type="button" data-action="exit" data-exit="na" data-role="exit-na">' + esc(UI_TEXT.exitNa) + '</button>';
      if (node.id !== stage.offScriptNodeId) h += '<button type="button" data-action="exit" data-exit="offscript" data-role="exit-offscript">' + esc(UI_TEXT.exitOffScript) + '</button>';
      h += '<button type="button" data-action="exit" data-exit="park" data-role="exit-park">' + esc(UI_TEXT.exitPark) + '</button>';
      h += '</div>';
    }

    h += '<div data-role="node-tools">';
    h += '<button type="button" data-action="toggle-lateral" data-role="lateral-button"' + attr('aria-expanded', state.ui.lateralOpen ? 'true' : 'false') + '>' + esc(UI_TEXT.lateralButton) + '</button>';
    h += '<button type="button" class="btn-quiet" data-action="toggle-flag" data-role="flag-button"' + attr('aria-expanded', state.ui.flagOpen ? 'true' : 'false') + '>' + esc(UI_TEXT.flagButton) + '</button>';
    h += '</div>';

    if (state.ui.lateralOpen) h += renderLateralPanel(node);
    if (state.ui.flagOpen) h += renderFlagForm(node);
    if (state.mode === 'training') h += renderTraining(node);

    h += '</article>';
    return h;
  }

  function renderLateralPanel(node) {
    var stageId = state.ui.lateralStage || node.stageId;
    var h = '<section data-role="lateral-panel" aria-label="' + esc(UI_TEXT.lateralTitle) + '">';
    h += '<header><h3>' + esc(UI_TEXT.lateralTitle) + '</h3><span class="small muted">' + esc(UI_TEXT.lateralHint) + '</span>' +
      '<button type="button" class="btn-quiet" data-action="toggle-lateral">' + esc(UI_TEXT.close) + '</button></header>';
    h += '<div data-role="lateral-stage-tabs">';
    STAGES.forEach(function (s) {
      h += '<button type="button" data-action="lateral-stage"' + attr('data-stage-id', s.id) + attr('aria-pressed', s.id === stageId ? 'true' : 'false') + '>' + esc(s.label) + '</button>';
    });
    h += '</div><ul data-role="lateral-list">';
    FLOW.nodes.filter(function (n) { return n.stageId === stageId; }).forEach(function (n) {
      var here = n.id === node.id;
      h += '<li><button type="button" data-role="lateral-item" data-action="lateral"' + attr('data-node-id', n.id) + attr('aria-current', here ? 'true' : null) + (here ? ' disabled' : '') + '>' +
        '<span class="risk-dot"' + attr('data-risk', n.risk) + '></span><strong>' + esc(n.label) + '</strong><span class="small muted">' + esc(n.prompt) + '</span>' +
        (here ? '<span class="tag">' + esc(UI_TEXT.lateralCurrent) + '</span>' : '') + '</button></li>';
    });
    h += '</ul></section>';
    return h;
  }

  function renderFlagForm(node) {
    var h = '<form data-role="flag-form" data-action="submit-flag">';
    h += '<h3>' + esc(UI_TEXT.flagTitle) + ' <span class="muted">' + esc(node.label) + '</span></h3>';
    h += '<fieldset>';
    Object.keys(UI_TEXT.flagKinds).forEach(function (k, i) {
      h += '<label><input type="radio" name="kind"' + attr('value', k) + (i === 0 ? ' checked' : '') + '> ' + esc(UI_TEXT.flagKinds[k]) + '</label>';
    });
    h += '</fieldset>';
    h += '<textarea name="comment" rows="2"' + attr('placeholder', UI_TEXT.flagCommentPlaceholder) + '></textarea>';
    h += '<div class="btn-row"><button type="submit" class="btn-primary">' + esc(UI_TEXT.flagSubmit) + '</button>' +
      '<button type="button" class="btn-quiet" data-action="toggle-flag">' + esc(UI_TEXT.flagCancel) + '</button></div>';
    h += '</form>';
    return h;
  }

  function renderTraining(node) {
    var h = '<section data-role="training-block">';
    if (node.why) h += '<details open><summary>' + esc(UI_TEXT.whyTitle) + '</summary><p class="small">' + esc(node.why) + '</p></details>';
    if (node.dialogue && node.dialogue.length) {
      h += '<details><summary>' + esc(UI_TEXT.dialogueTitle) + '</summary><ul data-role="dialogue">';
      node.dialogue.forEach(function (d) { h += '<li' + attr('data-who', d.who) + '><span class="who">' + esc(d.who) + '</span>' + esc(d.text) + '</li>'; });
      h += '</ul></details>';
    }
    h += '</section>';
    return h;
  }

  function renderNotePanel() {
    var text = buildNote();
    return '<section class="panel" data-role="note-panel" aria-label="' + esc(UI_TEXT.noteTitle) + '">' +
      '<div class="btn-row"><h3>' + esc(UI_TEXT.noteTitle) + '</h3>' +
      '<button type="button" class="btn-primary" data-action="copy-note" data-role="note-copy">' + esc(state.ui.noteCopied ? UI_TEXT.noteCopied : UI_TEXT.noteCopy) + '</button>' +
      '<button type="button" data-action="toggle-note">' + esc(UI_TEXT.close) + '</button></div>' +
      '<textarea data-role="note-text" readonly>' + esc(text) + '</textarea>' +
      '</section>';
  }

  function renderDebug() {
    var c = counts();
    var h = '<section class="panel" data-role="debug" aria-label="' + esc(UI_TEXT.debugTitle) + '">';
    h += '<div class="btn-row"><h3>' + esc(UI_TEXT.debugTitle) + '</h3><button type="button" data-action="toggle-debug">' + esc(UI_TEXT.close) + '</button></div>';
    h += '<div data-role="debug-counts">';
    Object.keys(UI_TEXT.debugCounts).forEach(function (k) { h += '<span><b>' + c[k] + '</b>' + esc(UI_TEXT.debugCounts[k]) + '</span>'; });
    h += '</div>';
    h += '<h3>' + esc(UI_TEXT.debugFlags) + '</h3>';
    if (!state.flags.length) h += '<p class="small muted">' + esc(UI_TEXT.debugFlagsEmpty) + '</p>';
    else {
      h += '<ul data-role="flag-list">';
      state.flags.forEach(function (f) {
        h += '<li><span class="tag">' + esc(UI_TEXT.flagKinds[f.kind]) + '</span> <strong>' + esc(NODES[f.nodeId].label) + '</strong> <span class="muted">(' + esc(f.nodeId) + ', ' + esc(f.mode) + ')</span>' +
          (f.comment ? '<br>' + esc(f.comment) : '') + '<br><span class="muted small">' + esc(f.at) + '</span></li>';
      });
      h += '</ul>';
    }
    h += '<h3>' + esc(UI_TEXT.debugLog) + '</h3><ol data-role="event-log">';
    state.log.slice().reverse().forEach(function (e) {
      h += '<li><span class="ev-time">' + esc(e.at.slice(11, 23)) + '</span><span class="ev-type">' + esc(e.type) + '</span><span>' + esc(JSON.stringify(e.detail)) + '</span></li>';
    });
    h += '</ol>';
    var view = { mode: state.mode, cursor: state.cursor, path: state.path, stale: state.stale ? { changedAt: state.stale.changedAt, reason: state.stale.reason, steps: state.stale.steps } : null, context: state.context, unresolved: state.unresolved };
    h += '<h3>' + esc(UI_TEXT.debugState) + '</h3><pre data-role="state-json">' + esc(JSON.stringify(view, null, 2)) + '</pre>';
    h += '</section>';
    return h;
  }

  /* ---- rail ---- */
  function renderRail() {
    var node = currentNode();
    var h = '<aside class="panel" data-role="rail" aria-label="' + esc(UI_TEXT.railTitle) + '">';
    h += '<h3>' + esc(UI_TEXT.railTitle) + '</h3>';
    var order = ['never', 'escalate', 'ask', 'watch', 'resource'];
    var any = false;
    order.forEach(function (type) {
      var blocks = node.content.filter(function (c) { return c.type === type; });
      if (!blocks.length) return;
      any = true;
      h += '<section data-role="content-group"' + attr('data-type', type) + '><h3>' + esc(UI_TEXT.groups[type]) + '</h3>';
      blocks.forEach(function (b) {
        h += '<div data-role="content-block"' + attr('data-type', type) + '>';
        if (type === 'resource') h += '<a' + attr('href', b.url || '#') + '>' + esc(b.text) + '</a>';
        else h += esc(b.text);
        h += '</div>';
      });
      h += '</section>';
    });
    if (!any) h += '<p data-role="rail-empty">' + esc(UI_TEXT.railEmpty) + '</p>';
    h += '</aside>';
    return h;
  }

  function renderFooter() {
    return '<footer data-role="footer"><span>' + esc(UI_TEXT.footerKeys) + '</span><span>' + esc(fmt(UI_TEXT.footerVersion, { v: FLOW.meta.contentVersion })) + '</span><span>' + esc(FLOW.meta.disclaimer) + '</span></footer>';
  }

  /* ---------------------------------------------------------- */
  /* Events: delegated, translate DOM events into actions        */
  /* ---------------------------------------------------------- */
  var root = document.getElementById('app');

  root.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]');
    if (!el || el.tagName === 'FORM') return;
    var action = el.getAttribute('data-action');
    switch (action) {
      case 'answer': dispatch({ type: 'answer', index: Number(el.getAttribute('data-index')) }); break;
      case 'exit': dispatch({ type: 'exit', exit: el.getAttribute('data-exit') }); break;
      case 'lateral': dispatch({ type: 'lateral', nodeId: el.getAttribute('data-node-id') }); break;
      case 'return': dispatch({ type: 'return', nodeId: el.getAttribute('data-node-id') }); break;
      case 'search-jump': dispatch({ type: 'search-jump', nodeId: el.getAttribute('data-node-id') }); break;
      case 'rewind': if (el.hasAttribute('data-index')) dispatch({ type: 'rewind', index: Number(el.getAttribute('data-index')) }); break;
      case 'set-mode': dispatch({ type: 'set-mode', mode: el.getAttribute('data-mode') }); break;
      case 'lateral-stage': dispatch({ type: 'lateral-stage', stageId: el.getAttribute('data-stage-id') }); break;
      case 'copy-note': copyNote(); break;
      default: dispatch({ type: action }); break;
    }
  });

  root.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.getAttribute('data-role') === 'context-input') dispatch({ type: 'set-context', key: el.getAttribute('data-key'), value: el.value });
  });

  root.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.getAttribute('data-role') === 'search-input') dispatch({ type: 'search', value: el.value });
  });

  root.addEventListener('submit', function (ev) {
    var form = ev.target.closest('form[data-action="submit-flag"]');
    if (!form) return;
    ev.preventDefault();
    var kind = form.querySelector('input[name="kind"]:checked');
    dispatch({ type: 'submit-flag', kind: kind ? kind.value : Object.keys(UI_TEXT.flagKinds)[0], comment: form.querySelector('textarea[name="comment"]').value.trim() });
  });

  root.addEventListener('keydown', function (ev) {
    var el = ev.target;
    if (el.getAttribute && el.getAttribute('data-role') === 'search-input' && ev.key === 'Enter') {
      var first = searchNodes(state.ui.search)[0];
      if (first) { ev.preventDefault(); dispatch({ type: 'search-jump', nodeId: first.id }); }
    }
  });

  document.addEventListener('keydown', function (ev) {
    var t = ev.target;
    var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
    if (ev.key === 'Escape') {
      if (typing) t.blur();
      dispatch({ type: 'close-panels' });
      return;
    }
    if (typing) return;
    if (ev.key === '/') { ev.preventDefault(); var s = document.querySelector('[data-role="search-input"]'); if (s) s.focus(); return; }
    if (/^[1-9]$/.test(ev.key) && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
      var node = currentNode();
      var i = Number(ev.key) - 1;
      if (!node.terminal && node.answers[i]) { ev.preventDefault(); dispatch({ type: 'answer', index: i }); }
    }
  });

  function copyNote() {
    var ta = document.querySelector('[data-role="note-text"]');
    if (!ta) return;
    var done = function () { dispatch({ type: 'note-copied' }); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(done, function () { legacyCopy(ta); done(); });
    } else { legacyCopy(ta); done(); }
  }
  function legacyCopy(ta) {
    ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
  }

  /* ---------------------------------------------------------- */
  logEvent('visit', { nodeId: FLOW.startNodeId, via: 'start', step: 1 });
  render();

  // Exposed for the smoke test and for poking at in the console. Read-only intent.
  window.__frd = { getState: function () { return JSON.parse(JSON.stringify(state)); }, flow: FLOW, dispatch: dispatch };
})();
</script>
</body>
</html>
