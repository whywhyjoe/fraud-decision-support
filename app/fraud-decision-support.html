<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fraud call guide — demo (placeholder content)</title>
<!--
  Fraud call guide: click-through demo.
  Single self-contained file: no build, no network, no storage.
  Layout of this file:
    1. <style>    every design value is a custom property in :root
    2. #flow-data ALL content, one JSON object (see the fence below)
    3. #app       empty shell, filled by render()
    4. <script>   state, reducer, pure render
-->
<style>
/* ============================================================ */
/* Design tokens. The only place a raw value may appear.         */
/* Greyscale only; red and amber are reserved for risk.          */
/* Nothing on the page is smaller than --fs-small.               */
/* ============================================================ */
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;

  --fs-small: 14px;
  --fs-body: 16px;
  --fs-lead: 18px;
  --fs-h1: 20px;
  --fs-guide-h: 20px;
  --fs-prompt: 26px;
  --lh-body: 1.5;
  --lh-tight: 1.25;

  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;

  --radius: 10px;
  --radius-lg: 14px;
  --radius-round: 999px;

  --bw: 1px;
  --bw-strong: 2px;
  --bw-line: 2px;

  --g-0: #ffffff;
  --g-1: #f5f5f5;
  --g-2: #e8e8e8;
  --g-3: #d0d0d0;
  --g-4: #a8a8a8;
  --g-5: #767676;
  --g-6: #4d4d4d;
  --g-7: #2e2e2e;
  --g-8: #1a1a1a;

  --critical: #b3261e;
  --critical-bg: #fbeeed;
  --elevated: #8a5a00;
  --elevated-bg: #fbf1dc;

  --fade: 120ms;

  --page-max: 1280px;
  --page-min: 900px;
  --banner-h: 36px;
  --control-h: 40px;
  --answer-h: 64px;
  --search-w: 280px;
  --dropdown-max-h: 420px;
  --spine-x: 28px;        /* where the flow's vertical line runs */
  --edge-h: 40px;         /* height of a connector between two steps */
  --fork-gap: 20px;       /* vertical gap between the question and its answers */
  --answer-gap: 16px;
  --quarter: 25%;
  --half: 50%;
  --full: 100%;
  --dim: 0.5;
  --z-banner: 50;
  --z-drop: 40;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--g-8);
  background: var(--g-1);
  padding-top: var(--banner-h);
}
h1, h2, h3 { margin: 0; line-height: var(--lh-tight); font-weight: 600; }
h1 { font-size: var(--fs-h1); }
h2 { font-size: var(--fs-prompt); }
h3 { font-size: var(--fs-body); }
p { margin: 0 0 var(--s-3) 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
a { color: var(--g-8); }
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  background: var(--g-0);
  border: var(--bw) solid var(--g-3);
  border-radius: var(--radius);
  padding: var(--s-2) var(--s-4);
  min-height: var(--control-h);
}
button:hover { background: var(--g-2); }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
  outline: var(--bw-strong) solid var(--g-8);
  outline-offset: var(--bw-strong);
}
input, textarea {
  font: inherit;
  color: inherit;
  border: var(--bw) solid var(--g-3);
  border-radius: var(--radius);
  padding: var(--s-2) var(--s-3);
  background: var(--g-0);
  min-height: var(--control-h);
}
[hidden] { display: none !important; }
.muted { color: var(--g-5); }
.small { font-size: var(--fs-small); }
.btn-dark { background: var(--g-8); color: var(--g-0); border-color: var(--g-8); }
.btn-dark:hover { background: var(--g-7); }
.btn-text { border-color: transparent; background: transparent; text-decoration: underline; padding-left: var(--s-2); padding-right: var(--s-2); }
.btn-text:hover { background: var(--g-2); }
.btn-toggle[aria-pressed="true"] { background: var(--g-8); color: var(--g-0); border-color: var(--g-8); }
.row { display: flex; gap: var(--s-3); align-items: center; flex-wrap: wrap; }

/* ---------- placeholder banner ---------- */
[data-role="placeholder-banner"] {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--banner-h);
  z-index: var(--z-banner);
  background: var(--g-8);
  color: var(--g-0);
  font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}

/* ---------- page grid: two equal columns ---------- */
[data-role="shell"] {
  max-width: var(--page-max);
  min-width: var(--page-min);
  margin: 0 auto;
  padding: var(--s-5) var(--s-5) var(--s-7);
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-areas: "top top" "path guide" "foot foot";
  column-gap: var(--s-6);
  row-gap: var(--s-5);
}
[data-role="top"] { grid-area: top; }
[data-role="path"] { grid-area: path; }
[data-role="guide"] { grid-area: guide; }
[data-role="foot"] { grid-area: foot; }
@media (max-width: 1000px) {
  [data-role="shell"] { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "path" "guide" "foot"; }
}

/* ---------- header row ---------- */
[data-role="header-row"] { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap; }
[data-role="header-row"] h1 { margin-right: auto; }
[data-role="header-row"] h1 span { font-weight: 400; color: var(--g-5); }
[data-role="search"] { position: relative; }
[data-role="search"] input { width: var(--search-w); }
[data-role="search-results"] {
  position: absolute; top: var(--full); right: 0; width: var(--search-w);
  z-index: var(--z-drop);
  margin-top: var(--s-1);
  background: var(--g-0);
  border: var(--bw) solid var(--g-3);
  border-radius: var(--radius);
  max-height: var(--dropdown-max-h);
  overflow: auto;
}
[data-role="search-result"], .search-empty {
  display: block; width: var(--full); text-align: left;
  border: 0; border-radius: 0; border-bottom: var(--bw) solid var(--g-2);
  padding: var(--s-3) var(--s-4);
}
[data-role="search-result"] span { display: block; color: var(--g-5); font-size: var(--fs-small); }
.search-empty { color: var(--g-5); }

/* ---------- the flow ---------- */
/* One vertical spine at --spine-x. Boxes sit to its right; connectors
   between boxes carry the answer that was chosen, like a labelled edge. */
[data-role="flow"] { position: relative; padding-left: var(--s-2); }
[data-role="flow"] > li { position: relative; }

[data-role="stage-label"] {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-2) 0;
  font-weight: 600;
  color: var(--g-6);
}
[data-role="stage-label"]::after { content: ""; flex: 1; border-top: var(--bw) solid var(--g-3); }
[data-role="stage-label"][data-state="ahead"] { color: var(--g-4); }
[data-role="stage-label"] + li { margin-top: var(--s-2); }

[data-role="edge"] {
  height: var(--edge-h);
  display: flex; align-items: center;
  padding-left: calc(var(--spine-x) + var(--s-4));
  position: relative;
  color: var(--g-6);
}
[data-role="edge"]::before {
  content: ""; position: absolute; left: var(--spine-x); top: 0; bottom: 0;
  border-left: var(--bw-line) solid var(--g-4);
}
[data-role="edge"] span { background: var(--g-1); padding: 0 var(--s-2); }
[data-role="edge"][data-state="ahead"]::before, [data-role="edge"][data-state="stale"]::before { border-left-style: dashed; }
[data-role="edge"][data-state="ahead"], [data-role="edge"][data-state="stale"] { color: var(--g-4); }
[data-role="edge"][data-state="stale"] span { text-decoration: line-through; }

[data-role="step-box"] {
  width: var(--full); text-align: left;
  display: flex; align-items: baseline; gap: var(--s-3); flex-wrap: wrap;
  padding: var(--s-3) var(--s-4);
  background: var(--g-0);
  border-color: var(--g-4);
}
[data-role="step-box"] .step-note { color: var(--g-5); width: var(--full); }
[data-role="step"][data-state="ahead"] [data-role="step-box"], [data-role="step"][data-state="stale"] [data-role="step-box"] { opacity: var(--dim); border-style: dashed; }
[data-role="step"][data-state="stale"] [data-role="step-box"] { text-decoration: line-through; }

[data-role="stale-notice"] {
  display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
  padding: var(--s-3) var(--s-4);
  background: var(--g-2);
  border-radius: var(--radius);
  margin: var(--s-4) 0;
}
[data-role="stale-notice"] strong { font-size: var(--fs-lead); }
[data-role="stale-notice"] .row { margin-left: auto; }

/* the current question */
[data-role="question-card"] {
  background: var(--g-0);
  border: var(--bw-strong) solid var(--g-8);
  border-radius: var(--radius-lg);
  padding: var(--s-5);
  position: relative;
}
[data-role="question-card"][data-fresh="true"] { animation: fade-in var(--fade) ease-out; }
[data-role="question-card"] .card-top { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-3); color: var(--g-5); flex-wrap: wrap; }
[data-role="question-card"] .card-top .spacer { flex: 1; }
[data-role="risk-line"] {
  border-radius: var(--radius);
  padding: var(--s-2) var(--s-4);
  font-weight: 600;
  margin-bottom: var(--s-3);
}
[data-role="risk-line"][data-risk="elevated"] { background: var(--elevated-bg); color: var(--elevated); }
[data-role="risk-line"][data-risk="critical"] { background: var(--critical-bg); color: var(--critical); }
[data-role="revisit-line"] { color: var(--g-6); margin-top: var(--s-3); }

/* answers: a two-column fork hanging off the question box */
[data-role="fork"] { margin-top: var(--s-4); }
[data-role="answers"] {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--answer-gap);
  padding-top: var(--fork-gap);
  margin-top: var(--fork-gap);
}
[data-role="answers"]::after {            /* stem down from the question */
  content: ""; position: absolute; left: var(--half); top: calc(var(--fork-gap) * -1); height: var(--fork-gap);
  border-left: var(--bw-line) solid var(--g-4);
}
[data-role="answers"]::before {           /* bar across the two columns */
  content: ""; position: absolute; top: 0; left: var(--quarter); right: var(--quarter);
  border-top: var(--bw-line) solid var(--g-4);
}
[data-role="answer"] { position: relative; }
[data-role="answer"]::before {            /* stub from the bar, or from the answer above */
  content: ""; position: absolute; left: var(--half); top: calc(var(--fork-gap) * -1); height: var(--fork-gap);
  border-left: var(--bw-line) solid var(--g-4);
}
[data-role="answer"]:nth-child(n+3)::before { top: calc(var(--answer-gap) * -1); height: var(--answer-gap); }
[data-role="answers"][data-count="1"] { grid-template-columns: 1fr; padding-top: 0; }
[data-role="answers"][data-count="1"]::before { display: none; }
[data-role="answers"][data-count="1"] [data-role="answer"]::before { display: none; }
[data-role="answer"] {
  min-height: var(--answer-h);
  text-align: center;
  font-size: var(--fs-lead);
  padding: var(--s-3) var(--s-4);
  border: var(--bw-strong) solid var(--g-4);
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: var(--s-1);
}
[data-role="answer"]:hover { border-color: var(--g-8); }
[data-role="answer"][data-previous="true"] { background: var(--g-2); border-color: var(--g-8); }
[data-role="answer"] .prev { color: var(--g-6); font-size: var(--fs-small); }
[data-role="other-ways"] { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; color: var(--g-5); margin-top: var(--s-4); }

[data-role="end-card"] { background: var(--g-1); border-radius: var(--radius); padding: var(--s-4) var(--s-5); margin-top: var(--s-4); }
[data-role="end-card"] p { margin-bottom: var(--s-3); }

/* other questions in this stage, opened from the card */
[data-role="stage-questions"] { margin-top: var(--s-4); padding-top: var(--s-4); border-top: var(--bw) solid var(--g-2); }
[data-role="stage-questions"] header { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-3); }
[data-role="stage-questions"] header h3 { margin-right: auto; }
[data-role="stage-questions"] ul { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); }
[data-role="stage-question"] { width: var(--full); text-align: left; display: flex; gap: var(--s-3); align-items: center; }
[data-role="stage-question"][aria-current="true"] { background: var(--g-2); border-color: var(--g-2); cursor: default; }
[data-role="stage-question"] .risk-mark { flex: none; width: var(--s-3); height: var(--s-3); border-radius: var(--radius-round); background: var(--g-3); }
[data-role="stage-question"] .risk-mark[data-risk="elevated"] { background: var(--elevated); }
[data-role="stage-question"] .risk-mark[data-risk="critical"] { background: var(--critical); }

[data-role="coaching"] { margin-top: var(--s-5); padding-top: var(--s-4); border-top: var(--bw) solid var(--g-2); }
[data-role="coaching"] h3 { margin-bottom: var(--s-2); }
[data-role="coaching"] section + section { margin-top: var(--s-4); }
[data-role="dialogue"] li { padding: var(--s-2) var(--s-4); border-radius: var(--radius); margin-bottom: var(--s-2); background: var(--g-1); }
[data-role="dialogue"] li[data-who="customer"] { background: var(--g-2); }
[data-role="dialogue"] .who { font-weight: 600; margin-right: var(--s-2); }

[data-role="feedback-row"] { margin-top: var(--s-4); }
[data-role="feedback-form"] { margin-top: var(--s-4); padding: var(--s-4) var(--s-5); background: var(--g-1); border-radius: var(--radius); }
[data-role="feedback-form"] h3 { margin-bottom: var(--s-3); }
[data-role="feedback-form"] fieldset { border: 0; padding: 0; margin: 0 0 var(--s-3); display: flex; gap: var(--s-4); flex-wrap: wrap; }
[data-role="feedback-form"] textarea { width: var(--full); margin-bottom: var(--s-3); }

/* ---------- guidance: the other half of the screen ---------- */
[data-role="guide"] {
  background: var(--g-0);
  border: var(--bw) solid var(--g-3);
  border-radius: var(--radius-lg);
  padding: var(--s-5);
  align-self: start;
}
[data-role="guide"] > h2 { font-size: var(--fs-guide-h); margin-bottom: var(--s-2); }
[data-role="guide"] > p { color: var(--g-5); margin-bottom: var(--s-5); }
[data-role="guide-group"] { margin-bottom: var(--s-5); }
[data-role="guide-group"] h3 { font-size: var(--fs-guide-h); margin-bottom: var(--s-3); }
[data-role="guide-item"] {
  font-size: var(--fs-lead);
  padding: var(--s-4) var(--s-5);
  border-radius: var(--radius);
  margin-bottom: var(--s-3);
  background: var(--g-1);
}
[data-role="guide-group"][data-type="never"] [data-role="guide-item"] { background: var(--g-8); color: var(--g-0); font-weight: 600; }
[data-role="guide-group"][data-type="escalate"] h3 { color: var(--critical); }
[data-role="guide-group"][data-type="escalate"] [data-role="guide-item"] { background: var(--g-0); border: var(--bw-strong) solid var(--critical); font-weight: 600; }
[data-role="guide-group"][data-type="watch"] [data-role="guide-item"] { background: var(--g-2); }
[data-role="guide-group"][data-type="resource"] [data-role="guide-item"] { padding: 0; background: var(--g-0); border: var(--bw-strong) solid var(--g-4); }
[data-role="guide-group"][data-type="resource"] a { display: block; padding: var(--s-4) var(--s-5); font-weight: 600; }
[data-role="guide-group"][data-type="resource"] a:hover { background: var(--g-2); }
[data-role="guide-empty"] { color: var(--g-5); }

/* ---------- footer and behind the scenes ---------- */
[data-role="foot"] { display: flex; gap: var(--s-4); align-items: center; flex-wrap: wrap; color: var(--g-5); font-size: var(--fs-small); border-top: var(--bw) solid var(--g-2); padding-top: var(--s-4); }
[data-role="foot"] .spacer { flex: 1; }
[data-role="debug"] { margin-top: var(--s-4); background: var(--g-0); border: var(--bw) solid var(--g-3); border-radius: var(--radius-lg); padding: var(--s-5); width: var(--full); color: var(--g-8); font-size: var(--fs-body); }
[data-role="debug"] h3 { margin: var(--s-4) 0 var(--s-2); }
[data-role="debug"] pre { font-family: var(--font-mono); font-size: var(--fs-small); background: var(--g-1); border-radius: var(--radius); padding: var(--s-4); max-height: var(--dropdown-max-h); overflow: auto; white-space: pre-wrap; margin: 0; }
[data-role="event-log"] { font-family: var(--font-mono); font-size: var(--fs-small); max-height: var(--dropdown-max-h); overflow: auto; border: var(--bw) solid var(--g-2); border-radius: var(--radius); }
[data-role="event-log"] li { display: flex; gap: var(--s-3); padding: var(--s-1) var(--s-3); border-bottom: var(--bw) solid var(--g-2); }
[data-role="event-log"] .ev-type { font-weight: 600; min-width: var(--s-7); }
[data-role="feedback-list"] li { padding: var(--s-3) var(--s-4); border: var(--bw) solid var(--g-2); border-radius: var(--radius); margin-bottom: var(--s-2); }

@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div data-role="placeholder-banner" role="note">Placeholder content for discussion — not bank policy</div>

<!-- ============================================================ -->
<!-- CONTENT: the one place scenario content lives.                -->
<!-- Everything below this line is placeholder, not bank policy.   -->
<!-- Edit this block to change questions, answers, guidance, links.-->
<!-- The page logic contains no content strings of its own.        -->
<!-- ============================================================ -->
<script type="application/json" id="flow-data">
{
  "meta": {
    "scenario": "Inbound call — customer reports unauthorised card transactions",
    "contentVersion": "0.3-placeholder",
    "disclaimer": "Placeholder content for discussion — not bank policy"
  },

  "stages": [
    { "id": "verify", "order": 1, "label": "Greeting & verification", "skipToNodeId": "triage-open",     "noneOfTheseNodeId": "verify-reanchor" },
    { "id": "triage", "order": 2, "label": "Triage",                  "skipToNodeId": "scope-open",      "noneOfTheseNodeId": "triage-reanchor" },
    { "id": "scope",  "order": 3, "label": "Scope",                   "skipToNodeId": "risk-open",       "noneOfTheseNodeId": "scope-reanchor" },
    { "id": "risk",   "order": 4, "label": "Risk signals",            "skipToNodeId": "act-block",       "noneOfTheseNodeId": "risk-reanchor" },
    { "id": "act",    "order": 5, "label": "Actions & close",         "skipToNodeId": "resolve-closed",  "noneOfTheseNodeId": "act-reanchor" }
  ],

  "startNodeId": "verify-open",

  "nodes": [

    {
      "id": "verify-open", "stageId": "verify", "label": "Identity verification", "risk": null,
      "prompt": "Has the caller passed identity verification?",
      "why": "Nothing about the account can be discussed until verification passes. Most of the damage in a fraud call happens in the first minute, when a rep sympathises with an upset caller and skips a step.",
      "dialogue": [
        { "who": "rep", "text": "Thanks for calling. Before we look at anything, I need to confirm a few details with you." },
        { "who": "customer", "text": "Someone's spent money on my card, I just need it stopped!" },
        { "who": "rep", "text": "I understand, and we'll get to that straight away. First, can you confirm your full name and date of birth?" }
      ],
      "content": [
        { "type": "ask", "text": "Full name, date of birth, and two knowledge questions from the verification panel." },
        { "type": "watch", "text": "Long pauses before answers, or answers read out slowly as if from a screen." },
        { "type": "never", "text": "Never read the card number, balance, or any recent transaction to the caller before verification passes." },
        { "type": "resource", "text": "Identity verification procedure (placeholder)", "url": "#" }
      ],
      "answers": [
        { "label": "Passed in full",                         "nextNodeId": "triage-open" },
        { "label": "Partial pass or one failure","nextNodeId": "verify-partial" },
        { "label": "Refused or unable to verify",                "nextNodeId": "verify-refuse" }
      ]
    },
    {
      "id": "verify-partial", "stageId": "verify", "label": "Verification partially failed", "risk": null,
      "prompt": "Which check failed?",
      "why": "The type of failure matters more than the fact of it. A wrong knowledge answer is usually a nervous customer; a caller who does not know their own details is a different problem.",
      "dialogue": [
        { "who": "customer", "text": "I can't remember what I set as my memorable place, sorry." }
      ],
      "content": [
        { "type": "ask", "text": "Offer the alternative knowledge question before moving to secondary verification." },
        { "type": "watch", "text": "The caller repeating your question out loud before answering it." },
        { "type": "resource", "text": "Identity verification procedure (placeholder)", "url": "#" }
      ],
      "answers": [
        { "label": "Knowledge question",              "nextNodeId": "verify-secondary" },
        { "label": "One-time code not received",           "nextNodeId": "verify-secondary" },
        { "label": "Caller unsure of own details", "nextNodeId": "verify-coached" }
      ]
    },
    {
      "id": "verify-secondary", "stageId": "verify", "label": "Secondary verification", "risk": null,
      "prompt": "Did callback verification to the number on file succeed?",
      "why": "A callback to a number we already hold is the cheapest strong check we have. It also quietly removes anyone who was on the original line.",
      "dialogue": [
        { "who": "rep", "text": "I'm going to call you back on the mobile number we have on file. It ends in the digits I'll read to you now." }

      "content": [

        { "type": "never", "text": "Never call back a number the caller gives you during the call." },
        { "type": "resource", "text": "Callback verification steps (placeholder)", "url": "#" }
      ],
      "answers": [

        { "label": "Failed",    "nextNodeId": "verify-refuse" }

    },
    {
      "id": "verify-refuse", "stageId": "verify", "label": "Unverified caller", "risk": null,
      "prompt": "What action is the unverified caller seeking?",
      "why": "An unverified caller can still stop the bleeding. Blocking a card only needs enough to identify it; discussing what was spent needs the full check.",

      "answers": [

        { "label": "Discussion of transactions",     "nextNodeId": "resolve-cannot-proceed" }
      ]
    },
    {
      "id": "verify-unverified-block", "stageId": "verify", "label": "Block without full verification", "risk": null,
      "prompt": "Has the card been identified and blocked?",

      "content": [

        { "type": "resource", "text": "Card block and reissue guide (placeholder)", "url": "#" }

      ]
    },
    {
      "id": "verify-coached", "stageId": "verify", "label": "Third-party coaching suspected", "risk": "critical",
      "prompt": "Is there evidence of a third party directing the caller?",
      "why": "Coached callers are often victims, not fraudsters. Someone beside them is running the call. Accusing them shuts it down; a neutral private callback usually breaks the pattern.",
      "dialogue": [
        { "who": "customer", "text": "Hang on... (muffled) ...yes, it's the one on the high street." },

      "content": [
        { "type": "watch", "text": "Muffled conversation, answers that arrive after a pause, the caller relaying your questions." },

        { "type": "escalate", "text": "Coaching suspected AND the caller asks to change contact details, add a payee, or move money — hand to a fraud specialist." },

      "answers": [

      ]
    },
    {
      "id": "verify-coached-confirm", "stageId": "verify", "label": "Private callback offered", "risk": "critical",
      "prompt": "Has the caller accepted a callback to the number on file?",

        { "type": "escalate", "text": "The caller refuses a callback and insists on completing a payment or detail change now." }

      "answers": [

        { "label": "Refused", "nextNodeId": "resolve-cannot-proceed" }

    {
      "id": "verify-reanchor", "stageId": "verify", "label": "Verification: none of these fit", "risk": null,

    {
      "id": "triage-open", "stageId": "triage", "label": "Nature of the report", "risk": null,
      "prompt": "Which best describes what is being reported?",
      "why": "This one answer decides which half of the tool you are in. 'Someone contacted me and I paid' is a scam, not fraud, and is handled completely differently from here on.",
      "dialogue": [
        { "who": "customer", "text": "There are three payments to a shop I've never heard of." }
      ],
      "content": [
        { "type": "ask", "text": "'Tell me in your own words what you've seen.' Then listen for whether they did anything themselves." },
        { "type": "watch", "text": "The customer mentions a phone call, text or email that started this — route to the scam branch, not fraud." },
        { "type": "resource", "text": "Scam vs fraud decision aid (placeholder)", "url": "#" }
      ],
      "answers": [
        { "label": "Unrecognised transactions",      "nextNodeId": "triage-ongoing" },
        { "label": "Card lost or stolen",                     "nextNodeId": "triage-lost" },
        { "label": "Payment made after unsolicited contact",    "nextNodeId": "risk-scam-entry" },
        { "label": "Outside this scenario",                          "nextNodeId": "triage-other" }
      ]
    },
    {
      "id": "triage-ongoing", "stageId": "triage", "label": "Ongoing activity", "risk": null,
      "prompt": "Is unauthorised activity still occurring?",

      "content": [
        { "type": "ask", "text": "'Do you see anything from today, or anything showing as pending?'" },
        { "type": "watch", "text": "Pending transactions the customer has not noticed — read the pending list, not just posted." }
      ],
      "answers": [
        { "label": "Yes: today or pending",  "nextNodeId": "triage-block-now" },
        { "label": "No: all in the past",    "nextNodeId": "triage-present" }
      ]
    },
    {
      "id": "triage-block-now", "stageId": "triage", "label": "Immediate card block", "risk": "elevated",
      "prompt": "Has the card been blocked?",
      "why": "Placeholder policy: block first, investigate second. A reissue is an inconvenience; an unblocked card is a liability.",
      "dialogue": [
        { "who": "rep", "text": "I'm going to block the card right now so nothing else can go through, and then we'll go through what's happened." }
      ],
      "content": [
        { "type": "ask", "text": "Confirm the last four digits before blocking. If more than one card, ask which." },
        { "type": "never", "text": "Never say 'the money is gone' or 'you'll get it all back' — neither is yours to promise." },
        { "type": "resource", "text": "Card block and reissue guide (placeholder)", "url": "#" }
      ],
      "answers": [
        { "label": "Blocked",                     "nextNodeId": "triage-present" },
        { "label": "Block declined by customer", "nextNodeId": "triage-decline-block" }
      ]
    },
    {
      "id": "triage-decline-block", "stageId": "triage", "label": "Block declined", "risk": "elevated",
      "prompt": "Why is the block being declined?",
      "why": "A declined block is a signal in itself. Sometimes practical, sometimes a family member, and sometimes because someone has told them not to.",
      "content": [
        { "type": "watch", "text": "'They told me not to cancel it' — someone else is directing this customer." },
        { "type": "never", "text": "Never threaten to block against the customer's wishes as a way to end the discussion." },
        { "type": "escalate", "text": "The customer says a third party instructed them to keep the card active." }
      ],
      "answers": [
        { "label": "Practical need for the card",  "nextNodeId": "triage-present" },
        { "label": "Possible household use", "nextNodeId": "scope-family" },
        { "label": "Third-party instruction not to block",     "nextNodeId": "risk-coached" }
      ]
    },
    {
      "id": "triage-present", "stageId": "triage", "label": "Transaction channel", "risk": null,
      "prompt": "Were the transactions card-present or card-not-present?",
      "why": "Card-present fraud with the card still in the customer's wallet is rare and points at cloning or a family member. Card-not-present is the common case.",
      "content": [
        { "type": "ask", "text": "Read the merchant channel from the transaction detail rather than asking the customer to guess." },
        { "type": "resource", "text": "Reading transaction channel codes (placeholder)", "url": "#" }
      ],
      "answers": [
        { "label": "Card present",      "nextNodeId": "scope-open" },
        { "label": "Card not present",  "nextNodeId": "scope-open" },
        { "label": "Mixed or unknown",  "nextNodeId": "scope-open" }
      ]
    },
    {
      "id": "triage-lost", "stageId": "triage", "label": "Lost or stolen card", "risk": null,
      "prompt": "Has the last known possession of the card been established?",
      "why": "The last-seen time bounds the dispute window and tells you whether a PIN could have been observed.",
      "dialogue": [
        { "who": "customer", "text": "I used it at the petrol station Tuesday and haven't seen it since." }

      ],
      "answers": [
        { "label": "Established: proceed to block", "nextNodeId": "triage-block-now" }
      ]
    },
    {
      "id": "triage-other", "stageId": "triage", "label": "Outside this scenario", "risk": null,

      "why": "The tool covers one scenario. Routing out early is better than forcing a merchant dispute through a fraud flow.",
      "content": [
        { "type": "ask", "text": "'So I send you to the right team: is this about money you didn't spend, or about something you bought?'" },
        { "type": "resource", "text": "Team routing directory (placeholder)", "url": "#" }
      ],
      "answers": [
        { "label": "Online banking access",     "nextNodeId": "resolve-transfer-out" },
        { "label": "Merchant or quality dispute",       "nextNodeId": "resolve-transfer-out" },
        { "label": "Unauthorised use after all",   "nextNodeId": "triage-ongoing" }
      ]
    },
    {
      "id": "triage-reanchor", "stageId": "triage", "label": "Triage: none of these fit", "risk": null,

    {
      "id": "scope-open", "stageId": "scope", "label": "Transaction review", "risk": null,
      "prompt": "How many transactions are disputed?",
      "why": "Reading the list together is where most 'fraud' turns out to be a subscription or a spouse. It is also where the customer calms down.",
      "dialogue": [
        { "who": "rep", "text": "I'll read the last ten and you tell me which ones aren't yours." }

      "content": [
        { "type": "ask", "text": "Read merchant, amount, date. Pause after each. Record the disputed total in the context strip." },
        { "type": "watch", "text": "A recognisable merchant billed under a parent-company name." },
        { "type": "resource", "text": "Merchant name lookup (placeholder)", "url": "#" }
      ],
      "answers": [
        { "label": "One",                     "nextNodeId": "scope-dates" },
        { "label": "Several",                 "nextNodeId": "scope-dates" },

      ]
    },
    {
      "id": "scope-dates", "stageId": "scope", "label": "Date range and recognition", "risk": null,

      "content": [
        { "type": "ask", "text": "First and last disputed date. Total amount. Fill both fields in the context strip." },
        { "type": "never", "text": "Never suggest the customer 'probably just forgot' a transaction." }

    },
    {
      "id": "scope-partial", "stageId": "scope", "label": "Partial recognition", "risk": null,

        { "type": "ask", "text": "'Does anyone else have access to the card details — a partner, a child, a carer?'" },

        { "label": "No",        "nextNodeId": "scope-possession" }

    {
      "id": "scope-family", "stageId": "scope", "label": "Household use possible", "risk": null,
      "prompt": "Will the customer check before disputing?",

    },
    {
      "id": "scope-possession", "stageId": "scope", "label": "Card possession", "risk": null,

        { "type": "watch", "text": "Card present in the wallet plus chip transactions elsewhere — flag for possible cloning." }

      "answers": [

    {
      "id": "risk-open", "stageId": "risk", "label": "Fraud pattern assessment", "risk": null,
      "prompt": "Which pattern fits the evidence?",
      "why": "The pattern decides the remedy. Fraud gets a block and a dispute. A scam gets a scam claim. Account takeover gets a credential reset. Picking wrong costs the customer weeks.",
      "content": [
        { "type": "ask", "text": "If undecided, run the signal checklist rather than guessing." },
        { "type": "resource", "text": "Scam vs fraud decision aid (placeholder)", "url": "#" }
      ],
      "answers": [
        { "label": "Unauthorised use, no contact with anyone",      "nextNodeId": "risk-fraud" },
        { "label": "Manipulation after unsolicited contact",                       "nextNodeId": "risk-scam-entry" },
        { "label": "Credential or device compromise",                       "nextNodeId": "risk-ato" },
        { "label": "Unclear: run the checklist",                                    "nextNodeId": "risk-signals" }
      ]
    },
    {
      "id": "risk-fraud", "stageId": "risk", "label": "Unauthorised use: standard", "risk": "low",

        { "label": "Recent contact-detail changes",        "nextNodeId": "risk-ato" },
        { "label": "Vulnerability indicators present",        "nextNodeId": "risk-elder" }
      ]
    },
    {
      "id": "risk-ato", "stageId": "risk", "label": "Account takeover red flags", "risk": "elevated",

        { "type": "ask", "text": "Read back the last three profile changes and ask the customer to confirm each one." },

        { "label": "Nothing found",        "nextNodeId": "act-block" }

    },
    {
      "id": "risk-scam-entry", "stageId": "risk", "label": "Manipulation suspected", "risk": "elevated",
      "prompt": "How was contact initiated?",

        { "type": "resource", "text": "Scam vs fraud decision aid (placeholder)", "url": "#" }
      ],
      "answers": [
        { "label": "Bank impersonation",        "nextNodeId": "risk-scam-bank" },
        { "label": "Romance, investment or prize",           "nextNodeId": "risk-scam-manip" },
        { "label": "Tech support, government or police impersonation",     "nextNodeId": "risk-scam-manip" }
      ]
    },
    {
      "id": "risk-scam-bank", "stageId": "risk", "label": "Bank impersonation", "risk": "elevated",
      "prompt": "What did the customer disclose or do?",
      "why": "Sharing a code means the attacker has, or had, live access. Moving money means a scam claim. Both can be true.",
      "content": [
        { "type": "ask", "text": "'Did they ask you to read anything back to them — a code from a text, or from your card reader?'" },
        { "type": "escalate", "text": "The customer is still on another line with the 'bank' right now." }
      ],
      "answers": [

        { "label": "Moved money themselves",              "nextNodeId": "act-scam-case" },

      ]
    },
    {
      "id": "risk-scam-manip", "stageId": "risk", "label": "Authorised push payment scam", "risk": "elevated",
      "prompt": "Is contact with the third party ongoing?",

      "content": [
        { "type": "watch", "text": "The customer defends the third party, or has been told the bank will 'try to stop them being together'." },
        { "type": "never", "text": "Never call the third party a scammer to the customer's face on a first call." },
        { "type": "escalate", "text": "Ongoing contact plus further payments planned." }
      ],
      "answers": [
        { "label": "Ongoing",   "nextNodeId": "risk-coached" },
        { "label": "Ended", "nextNodeId": "act-scam-case" }
      ]
    },
    {
      "id": "risk-elder", "stageId": "risk", "label": "Elder financial exploitation red flags", "risk": "critical",
      "prompt": "Which indicators are present?",
      "why": "Exploitation of an older customer by someone they trust is under-reported and rarely self-reported. The rep on the phone is often the only person positioned to notice.",
      "dialogue": [
        { "who": "customer", "text": "My neighbour does my shopping with the card. I don't really check it, she's very good to me." }
      ],
      "content": [
        { "type": "ask", "text": "'Who helps you with your banking day to day?' Then listen — do not lead." },

        { "type": "never", "text": "Never say 'it sounds like someone is taking advantage of you'." },
        { "type": "escalate", "text": "Any of the watch-for indicators together with the customer being unable to explain their own transactions — safeguarding referral, not a dispute." },
        { "type": "resource", "text": "Vulnerable customer and safeguarding referral (placeholder)", "url": "#" }
      ],
      "answers": [
        { "label": "New helper with card access",               "nextNodeId": "act-safeguard" },
        { "label": "Customer cannot explain own transactions",  "nextNodeId": "act-safeguard" },

    },
    {
      "id": "risk-coached", "stageId": "risk", "label": "Third-party coaching on the call", "risk": "critical",
      "prompt": "What is the evidence?",
      "why": "A customer being coached will agree to whatever keeps the third party calm. Nothing agreed on this call is reliable. The goal is a safe callback, not a resolution.",
      "dialogue": [
        { "who": "customer", "text": "No, no, keep the card open. (pause) Yes. Keep it open, it's fine." }
      ],
      "content": [
        { "type": "watch", "text": "Answers that reverse after a pause. Background prompting. The customer asking you to repeat questions." },
        { "type": "never", "text": "Never confront the third party through the customer." },
        { "type": "escalate", "text": "Always — this node ends in a safeguarding hand-off, never in a normal close." },

      ],
      "answers": [
        { "label": "Third party audible",               "nextNodeId": "act-safeguard" },

    },
    {
      "id": "risk-signals", "stageId": "risk", "label": "Signal checklist", "risk": null,
      "prompt": "Which group of signals dominates?",

      "content": [

        { "type": "resource", "text": "Signal checklist card (placeholder)", "url": "#" }

        { "label": "Unauthorised use",   "nextNodeId": "risk-fraud" },

    {
      "id": "risk-reanchor", "stageId": "risk", "label": "Risk: none of these fit", "risk": null,
      "prompt": "None of the listed situations apply. Which is closest?",

      "content": [
        { "type": "ask", "text": "'That's important — tell me more about that.'" }

      "answers": [

    {
      "id": "act-block", "stageId": "act", "label": "Block and reissue", "risk": null,
      "prompt": "Are block and reissue complete?",
      "why": "If the card was blocked at triage this is a confirmation. If not, it happens now, before the dispute.",
      "content": [
        { "type": "ask", "text": "Confirm the delivery address on file out loud before ordering the replacement." },
        { "type": "watch", "text": "The delivery address was changed in the last 30 days — stop and go back to the takeover check." },
        { "type": "resource", "text": "Card block and reissue guide (placeholder)", "url": "#" }
      ],

    },
    {
      "id": "act-ato-lock", "stageId": "act", "label": "Account lock-down", "risk": "critical",
      "prompt": "Are the lock-down steps complete?",
      "why": "Order matters: lock the login first, or the attacker undoes everything else while you are on the phone.",
      "content": [
        { "type": "ask", "text": "Which device does the customer normally use? Everything else gets removed." },
        { "type": "never", "text": "Never send the new credentials to the contact details the attacker set." },
        { "type": "escalate", "text": "Outbound payments were set up during the compromise window — payments team, now." },
        { "type": "resource", "text": "Account takeover lock-down checklist (placeholder)", "url": "#" }
      ],
      "answers": [
        { "label": "Complete", "nextNodeId": "act-credit" }
      ]
    },
    {
      "id": "act-scam-case", "stageId": "act", "label": "Scam claim", "risk": null,
      "prompt": "Has a scam claim been opened?",
      "why": "A scam claim is assessed on whether the customer could reasonably have known. It needs the story, not just the transactions.",
      "content": [
        { "type": "ask", "text": "Capture the story in the customer's words: first contact, what they were told, what they did." },
        { "type": "never", "text": "Never promise a refund outcome. The claim is assessed later by someone else." },
        { "type": "resource", "text": "Scam claim form (placeholder)", "url": "#" }
      ],

      ]
    },
    {
      "id": "act-safeguard", "stageId": "act", "label": "Safeguarding referral", "risk": "critical",
      "prompt": "Are the referral and payment hold in place?",
      "why": "This is the node the whole critical branch exists for. It is also the one reps skip because it feels like an accusation. It is not — it is a request for someone trained to take a look.",
      "content": [
        { "type": "ask", "text": "Tell the customer a colleague who specialises in this will call them back. Agree a safe number and time." },
        { "type": "never", "text": "Never describe the referral as being about the third party, and never use the word 'abuse' on the call." },
        { "type": "escalate", "text": "Immediate risk to the customer's safety — follow the emergency process, not this one." },
        { "type": "resource", "text": "Vulnerable customer and safeguarding referral (placeholder)", "url": "#" }
      ],

        { "label": "In place", "nextNodeId": "act-timeline" }

    },
    {
      "id": "act-credit", "stageId": "act", "label": "Provisional credit", "risk": null,
      "prompt": "Are the provisional credit criteria met?",
      "why": "Provisional credit is the single thing the customer will remember. Getting the explanation right matters more than the decision.",
      "content": [
        { "type": "ask", "text": "Check: amount under threshold, first dispute in 12 months, card blocked." },
        { "type": "never", "text": "Never call it a refund. It is provisional and can be reversed." },
        { "type": "resource", "text": "Provisional credit criteria (placeholder)", "url": "#" }
      ],

    },
    {
      "id": "act-case", "stageId": "act", "label": "Fraud case", "risk": null,
      "prompt": "Has the case been created and the reference given?",
      "why": "A customer with a reference number calls back once. A customer without one calls back three times.",
      "content": [
        { "type": "ask", "text": "Read the reference twice. Ask the customer to read it back." },
        { "type": "resource", "text": "Case creation guide (placeholder)", "url": "#" }

    },
    {
      "id": "act-timeline", "stageId": "act", "label": "Next steps and timelines", "risk": null,
      "prompt": "Does the customer understand what happens next?",

      "dialogue": [

      ],
      "content": [

      "prompt": "None of the listed situations apply. Which is closest?",
      "why": "At this stage, off the expected path usually means new information. Do not close a call over new information.",
      "content": [
        { "type": "ask", "text": "'Before I finish up — is there anything else about this you've remembered?'" }
      ],
      "answers": [
        { "label": "New information changes the pattern", "nextNodeId": "risk-open" },
        { "label": "Provisional credit decision disputed",       "nextNodeId": "act-credit" },
        { "label": "Customer ready to finish",                            "nextNodeId": "act-timeline" }
      ]
    },

    {
      "id": "resolve-closed", "stageId": "act", "label": "Call closed", "risk": null, "terminal": true,
      "prompt": "Case created, customer informed, timelines set.",
      "why": "The normal ending. Generate the call note before the next call, not after.",
      "content": [
        { "type": "ask", "text": "Generate the call note and paste it into the case." }
      ],
      "answers": []
    },
    {
      "id": "resolve-escalated", "stageId": "act", "label": "Escalated", "risk": null, "terminal": true,
      "prompt": "Warm transfer to a specialist or team leader.",
      "why": "An escalation with a good note is a five-minute handover. Without one it is a repeat of the whole call.",
      "content": [
        { "type": "ask", "text": "Generate the call note and hand it over with the transfer." },
        { "type": "resource", "text": "Escalation contacts (placeholder)", "url": "#" }
      ],
      "answers": []
    },
    {
      "id": "resolve-callback-scheduled", "stageId": "act", "label": "Callback scheduled", "risk": null, "terminal": true,
      "prompt": "Callback logged to the number on file with a time window.",
      "why": "A callback that is not in the diary does not happen.",
      "content": [
        { "type": "ask", "text": "Log the callback with the reason and the number ending. Generate the call note." },
        { "type": "never", "text": "Never schedule a callback to a number given on this call." }
      ],
      "answers": []
    },
    {
      "id": "resolve-cannot-proceed", "stageId": "act", "label": "Cannot proceed on this call", "risk": "elevated", "terminal": true,
      "prompt": "Options given: branch visit with ID, or callback to the number on file.",
      "why": "Unverified or unsafe calls end here. The customer still needs a path: branch visit, callback from the number on file, or a letter.",
      "content": [
        { "type": "ask", "text": "Offer branch visit with ID, or a callback to the number on file." },
        { "type": "escalate", "text": "Anything on this call suggested a third party — log the safeguarding concern even though the call could not proceed." }
      ],
      "answers": []
    },
    {
      "id": "resolve-transfer-out", "stageId": "act", "label": "Transferred to another team", "risk": null, "terminal": true,
      "prompt": "Warm transfer with a short handover note.",
      "why": "A short note prevents the receiving team from re-verifying the customer from scratch.",
      "content": [
        { "type": "resource", "text": "Team routing directory (placeholder)", "url": "#" }
      ],
      "answers": []
    },
    {
      "id": "resolve-unverified-close", "stageId": "act", "label": "Card blocked, caller unverified", "risk": null, "terminal": true,
      "prompt": "Block done; verification and any dispute still to complete.",
      "why": "The block protects the account; the dispute still needs a verified customer.",
      "content": [
        { "type": "ask", "text": "Branch visit with ID, or call back with the verification details to hand." },
        { "type": "never", "text": "Never confirm which transactions are on the account." }
      ],
      "answers": []
    }
  ]
}
</script>

<!-- App shell. Filled entirely by render(). Nothing below holds   -->
<!-- content; the chrome labels come from UI_TEXT in the script.   -->
<!-- ============================================================ -->
<div id="app" data-role="shell"></div>

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------- */
  /* Data                                                        */
  /* ---------------------------------------------------------- */
  var FLOW = JSON.parse(document.getElementById('flow-data').textContent);
  var NODES = {};
  FLOW.nodes.forEach(function (n) { NODES[n.id] = n; });
  var STAGES = FLOW.stages.slice().sort(function (a, b) { return a.order - b.order; });
  var STAGE = {};
  STAGES.forEach(function (s) { STAGE[s.id] = s; });

  /* Chrome labels. Not scenario content, but kept in one table so the
     render functions hold no literals. Plain words: question, step, stage. */
  var UI_TEXT = {
    title: 'Fraud call guide',
    searchPlaceholder: 'Find a topic…',
    searchEmpty: 'No topic matches',
    coachingToggle: 'Coaching notes',
    newCall: 'Start a new call',
    flowLabel: 'The call so far',
    stageOf: 'Stage {n} of {total}',
    back: 'Back',
    otherQuestions: 'Other topics in this stage',
    otherQuestionsHint: 'Pick one to go straight there. The steps so far are kept.',
    youAreHere: 'you are here',
    close: 'Close',
    riskLine: { elevated: 'Elevated risk', critical: 'Critical: read the guidance on the right before you speak' },
    revisit: 'You are back at step {n}. Choose the same answer to carry on, or a different one.',
    previously: 'your earlier answer',
    noneOfThese: 'None of these fit',
    later: 'Come back to this later',
    endTitle: 'End of call',
    endHint: 'Start a new call for the next customer.',
    coachingWhy: 'Why this matters',
    coachingExample: 'Example',
    speakers: { rep: 'You', customer: 'Customer' },
    feedbackLink: 'Something wrong with this step?',
    feedbackTitle: 'Feedback on this step',
    feedbackKinds: { wrong: 'Wrong', unclear: 'Unclear', missing: 'Missing a resource' },
    feedbackPlaceholder: 'What would you change?',
    feedbackSend: 'Send feedback',
    feedbackCancel: 'Cancel',
    guideTitle: 'Guidance',
    guideFor: 'For: {topic}',
    guideEmpty: 'No guidance written for this topic yet.',
    groups: { never: 'Never', escalate: 'Escalate when', ask: 'Check or ask', watch: 'Watch for', resource: 'Resources' },
    stepNotes: { later: 'Skipped for now', jumped: 'Jumped here', searched: 'Jumped here from a search', none: 'None of the answers fit', movedOn: 'Moved on without answering', resolvedLater: 'Answered later' },
    staleTitle: '{n} later step{s} no longer appl{y}',
    staleHint: 'Because the answer at step {n} changed.',
    undo: 'Undo',
    dismiss: 'Dismiss',
    keysHint: 'Keys 1 to 9 choose an answer',
    contentVersion: 'Content {v}',
    behind: 'Behind the scenes',
    behindSummary: '{visits} steps visited · {jumps} jumps · {backs} times back · {stale} times later steps dropped · {later} skipped for now · {feedback} feedback',
    behindFeedback: 'Feedback',
    behindFeedbackEmpty: 'No feedback yet.',
    behindLog: 'Event log',
    behindState: 'Current state'
  };

  /* ---------------------------------------------------------- */
  /* State                                                       */
  /* ---------------------------------------------------------- */
  var state = initialState();

  function initialState() {
    return {
      coaching: false,
      path: [{ nodeId: FLOW.startNodeId, arrivedVia: 'start', answer: null, status: 'open' }],
      cursor: 0,
      stale: null,
      feedback: [],
      log: [],
      ui: { stageOpen: false, feedbackOpen: false, debugOpen: false, search: '', searchOpen: false, fresh: true }
    };
  }

  function currentStep() { return state.path[state.cursor]; }
  function currentNode() { return NODES[currentStep().nodeId]; }

  function logEvent(type, detail) {
    state.log.push({ at: new Date().toISOString(), type: type, detail: detail || {} });
  }

  /* Any forward move from a rewound position invalidates the steps after
     the cursor. They are kept as stale, shown struck through, until undone
     or dismissed. */
  function invalidateDownstream(reason) {
    if (state.cursor >= state.path.length - 1) return;
    var snap = JSON.parse(JSON.stringify({ path: state.path, cursor: state.cursor }));
    var dropped = state.path.slice(state.cursor + 1);
    state.path = state.path.slice(0, state.cursor + 1);
    state.stale = { steps: dropped, changedAt: state.cursor, reason: reason, snapshot: snap };
    logEvent('stale', { changedAt: state.cursor + 1, dropped: dropped.length, reason: reason });
  }

  function moveTo(nodeId, via) {
    state.path.push({ nodeId: nodeId, arrivedVia: via, answer: null, status: 'open' });
    state.cursor = state.path.length - 1;
    state.ui.stageOpen = false; state.ui.feedbackOpen = false; state.ui.searchOpen = false; state.ui.search = '';
    state.ui.fresh = true;
    logEvent('visit', { question: nodeId, via: via, step: state.cursor + 1 });
  }

  function leaveCurrent(newStatus) {
    var step = currentStep();
    if (step.status === 'open') step.status = newStatus;
  }

  /* ---------------------------------------------------------- */
  /* Reducer                                                     */
  /* ---------------------------------------------------------- */
  function dispatch(action) {
    var step = currentStep();
    var node = currentNode();
    var stage = STAGE[node.stageId];
    state.ui.fresh = false;

    switch (action.type) {

      case 'answer': {
        var answer = node.answers[action.index];
        if (!answer) break;
        if (state.cursor < state.path.length - 1 && step.answer === answer.label) {
          state.cursor += 1;
          state.ui.fresh = true;
          logEvent('forward', { step: state.cursor + 1 });
          break;
        }
        invalidateDownstream('answer-changed');
        step.answer = answer.label; step.status = 'answered';
        state.path.forEach(function (s) { if (s !== step && s.nodeId === node.id && s.status === 'later') s.status = 'resolved-later'; });
        logEvent('answer', { question: node.id, answer: answer.label });
        moveTo(answer.nextNodeId, 'answer');
        break;
      }

      case 'none-of-these': {
        invalidateDownstream('none-of-these');
        step.status = 'none'; step.answer = null;
        logEvent('none-of-these', { question: node.id });
        moveTo(stage.noneOfTheseNodeId, 'none');
        break;
      }

      case 'later': {
        invalidateDownstream('later');
        step.status = 'later'; step.answer = null;
        logEvent('later', { question: node.id });
        moveTo(stage.skipToNodeId, 'later');
        break;
      }

      case 'jump': {
        if (action.nodeId === node.id) { state.ui.stageOpen = false; break; }
        invalidateDownstream('jump');
        leaveCurrent('moved-on');
        logEvent('jump', { from: node.id, to: action.nodeId, via: action.via });
        moveTo(action.nodeId, action.via);
        break;
      }

      case 'rewind': {
        if (action.index === state.cursor || action.index < 0 || action.index >= state.path.length) break;
        logEvent('back', { from: state.cursor + 1, to: action.index + 1 });
        state.cursor = action.index;
        state.ui.stageOpen = false; state.ui.feedbackOpen = false;
        state.ui.fresh = true;
        break;
      }

      case 'undo-stale': {
        if (!state.stale) break;
        state.path = state.stale.snapshot.path; state.cursor = state.stale.snapshot.cursor;
        state.stale = null;
        state.ui.fresh = true;
        logEvent('undo', { backTo: state.cursor + 1 });
        break;
      }

      case 'dismiss-stale': {
        if (!state.stale) break;
        logEvent('stale-dismissed', { dropped: state.stale.steps.length });
        state.stale = null;
        break;
      }

      case 'toggle-coaching': { state.coaching = !state.coaching; logEvent('coaching', { on: state.coaching }); break; }
      case 'toggle-stage': { state.ui.stageOpen = !state.ui.stageOpen; state.ui.feedbackOpen = false; break; }
      case 'toggle-feedback': { state.ui.feedbackOpen = !state.ui.feedbackOpen; state.ui.stageOpen = false; break; }
      case 'send-feedback': {
        state.feedback.push({ id: state.feedback.length + 1, question: node.id, kind: action.kind, comment: action.comment, at: new Date().toISOString() });
        state.ui.feedbackOpen = false;
        logEvent('feedback', { question: node.id, kind: action.kind });
        break;
      }

      case 'search': { state.ui.search = action.value; state.ui.searchOpen = action.value.trim().length > 0; break; }
      case 'toggle-debug': { state.ui.debugOpen = !state.ui.debugOpen; break; }
      case 'close-panels': { state.ui.stageOpen = false; state.ui.feedbackOpen = false; state.ui.searchOpen = false; break; }

      case 'reset': {
        var keep = { coaching: state.coaching, feedback: state.feedback, log: state.log };
        state = initialState();
        state.coaching = keep.coaching; state.feedback = keep.feedback; state.log = keep.log;
        logEvent('new-call', {});
        break;
      }
    }
    render();
  }

  /* ---------------------------------------------------------- */
  /* Derived                                                     */
  /* ---------------------------------------------------------- */
  function searchNodes(query) {
    var q = query.trim().toLowerCase();
    if (!q) return [];
    return FLOW.nodes.filter(function (n) {
      var hay = [n.label, n.prompt, STAGE[n.stageId].label].concat(n.content.map(function (c) { return c.text; })).join(' ').toLowerCase();
      return hay.indexOf(q) >= 0;
    }).slice(0, 10);
  }

  function counts() {
    var c = { visits: 0, jumps: 0, backs: 0, stale: 0, later: 0, feedback: 0 };
    state.log.forEach(function (e) {
      if (e.type === 'visit') c.visits += 1;
      if (e.type === 'jump') c.jumps += 1;
      if (e.type === 'back') c.backs += 1;
      if (e.type === 'stale') c.stale += 1;
      if (e.type === 'later') c.later += 1;
      if (e.type === 'feedback') c.feedback += 1;
    });
    return c;
  }

  /* ---------------------------------------------------------- */
  /* Render: state in, DOM out. One call per dispatch.           */
  /* ---------------------------------------------------------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(tpl, vars) { return tpl.replace(/\{(\w+)\}/g, function (_, k) { return vars[k] != null ? vars[k] : ''; }); }
  function attr(name, v) { return v == null || v === false ? '' : ' ' + name + '="' + esc(v) + '"'; }

  function render() {
    var root = document.getElementById('app');
    var focus = captureFocus();
    root.innerHTML = renderTop() + renderFlow() + renderGuide() + renderFoot();
    restoreFocus(focus);
    if (state.ui.fresh) {
      var card = root.querySelector('[data-role="question-card"]');
      if (card && card.scrollIntoView) card.scrollIntoView({ block: 'nearest' });
    }
  }

  function captureFocus() {
    var el = document.activeElement;
    var key = el && el.getAttribute ? el.getAttribute('data-focus-key') : null;
    return key ? { key: key, start: el.selectionStart, end: el.selectionEnd } : null;
  }
  function restoreFocus(f) {
    if (!f) return;
    var el = document.querySelector('[data-role="' + f.key + '"]');
    if (!el) return;
    el.focus();
    if (typeof f.start === 'number' && el.setSelectionRange) { try { el.setSelectionRange(f.start, f.end); } catch (e) {} }
  }

  /* ---- top: one header row ---- */
  function renderTop() {
    return '<header data-role="top"><div data-role="header-row">' +
      '<h1>' + esc(UI_TEXT.title) + ' <span>' + esc(FLOW.meta.scenario) + '</span></h1>' +
      renderSearch() +
      '<button type="button" class="btn-toggle" data-action="toggle-coaching" data-role="coaching-toggle"' + attr('aria-pressed', state.coaching ? 'true' : 'false') + '>' + esc(UI_TEXT.coachingToggle) + '</button>' +
      '<button type="button" data-action="reset" data-role="new-call">' + esc(UI_TEXT.newCall) + '</button>' +
      '</div></header>';
  }

  function renderSearch() {
    var results = state.ui.searchOpen ? searchNodes(state.ui.search) : [];
    var h = '<div data-role="search" role="search">';
    h += '<input type="search" data-role="search-input" data-focus-key="search-input" autocomplete="off"' +
      attr('placeholder', UI_TEXT.searchPlaceholder) + attr('value', state.ui.search) + attr('aria-label', UI_TEXT.searchPlaceholder) + '>';
    if (state.ui.searchOpen) {
      h += '<div data-role="search-results">';
      if (!results.length) h += '<div class="search-empty">' + esc(UI_TEXT.searchEmpty) + '</div>';
      results.forEach(function (n) {
        h += '<button type="button" data-role="search-result" data-action="jump" data-via="searched"' + attr('data-node-id', n.id) + '>' +
          esc(n.label) + '<span>' + esc(STAGE[n.stageId].label) + '</span></button>';
      });
      h += '</div>';
    }
    return h + '</div>';
  }

  /* ---- the flow: stage labels, step boxes, labelled edges, the card ---- */
  function renderFlow() {
    var h = '<main data-role="path"' + attr('aria-label', UI_TEXT.flowLabel) + '><ol data-role="flow">';
    var lastStage = null;
    var items = state.path.map(function (step, i) { return { step: step, i: i, state: i === state.cursor ? 'current' : (i < state.cursor ? 'past' : 'ahead') }; });
    if (state.stale) state.stale.steps.forEach(function (step, j) { items.push({ step: step, i: state.stale.changedAt + 1 + j, state: 'stale', firstStale: j === 0 }); });

    items.forEach(function (it, k) {
      var node = NODES[it.step.nodeId];
      var prev = k > 0 ? items[k - 1] : null;
      if (it.firstStale) h += '<li>' + renderStaleNotice() + '</li>';
      if (prev) h += renderEdge(prev.step, it.state === 'past' ? 'past' : it.state);
      if (node.stageId !== lastStage && it.state !== 'stale') {
        h += renderStageLabel(STAGE[node.stageId], it.state === 'current' ? 'current' : it.state);
        lastStage = node.stageId;
      }
      if (it.state === 'current') h += '<li data-role="step" data-state="current">' + renderQuestionCard(it.step, it.i) + '</li>';
      else h += renderStepBox(it.step, it.i, it.state);
    });

    // the stages still to come, faint, so the road ahead is visible
    var currentOrder = STAGE[currentNode().stageId].order;
    STAGES.filter(function (s) { return s.order > currentOrder; }).forEach(function (s) {
      h += renderStageLabel(s, 'ahead');
    });
    return h + '</ol></main>';
  }

  function renderStageLabel(stage, st) {
    var idx = STAGES.indexOf(stage);
    return '<li data-role="stage-label"' + attr('data-state', st) + attr('data-stage-id', stage.id) + '>' +
      '<span>' + esc(fmt(UI_TEXT.stageOf, { n: idx + 1, total: STAGES.length })) + ' · ' + esc(stage.label) + '</span></li>';
  }

  /* the connector between two boxes carries what was chosen at the upper one */
  function renderEdge(prevStep, st) {
    var text = prevStep.answer || stepNote(prevStep) || '';
    return '<li data-role="edge"' + attr('data-state', st) + '>' + (text ? '<span>' + esc(text) + '</span>' : '') + '</li>';
  }

  function stepNote(step) {
    if (step.status === 'later') return UI_TEXT.stepNotes.later;
    if (step.status === 'resolved-later') return UI_TEXT.stepNotes.resolvedLater;
    if (step.status === 'none') return UI_TEXT.stepNotes.none;
    if (step.status === 'moved-on') return UI_TEXT.stepNotes.movedOn;
    return '';
  }
  function arrivalNote(step) {
    if (step.arrivedVia === 'jumped') return UI_TEXT.stepNotes.jumped;
    if (step.arrivedVia === 'searched') return UI_TEXT.stepNotes.searched;
    return '';
  }

  function renderStepBox(step, i, stateName) {
    var n = NODES[step.nodeId];
    var notes = [arrivalNote(step), stepNote(step)].filter(Boolean).join(' · ');
    var clickable = stateName !== 'stale';
    return '<li data-role="step"' + attr('data-state', stateName) + attr('data-node-id', n.id) + '>' +
      '<button type="button" data-role="step-box" data-action="rewind"' + attr('data-index', clickable ? i : null) + (clickable ? '' : ' disabled') + '>' +
      '<strong>' + (i + 1) + '. ' + esc(n.label) + '</strong>' +
      (notes ? '<span class="step-note">' + esc(notes) + '</span>' : '') +
      '</button></li>';
  }

  function renderStaleNotice() {
    var n = state.stale.steps.length;
    return '<div data-role="stale-notice" role="status">' +
      '<strong>' + esc(fmt(UI_TEXT.staleTitle, { n: n, s: n === 1 ? '' : 's', y: n === 1 ? 'ies' : 'y' })) + '</strong>' +
      '<span class="muted">' + esc(fmt(UI_TEXT.staleHint, { n: state.stale.changedAt + 1 })) + '</span>' +
      '<span class="row"><button type="button" class="btn-dark" data-action="undo-stale" data-role="stale-undo">' + esc(UI_TEXT.undo) + '</button>' +
      '<button type="button" data-action="dismiss-stale" data-role="stale-dismiss">' + esc(UI_TEXT.dismiss) + '</button></span></div>';
  }

  function renderQuestionCard(step, i) {
    var node = NODES[step.nodeId];
    var stage = STAGE[node.stageId];
    var revisiting = state.cursor < state.path.length - 1;
    var h = '<article data-role="question-card"' + attr('data-node-id', node.id) + attr('data-risk', node.risk) + attr('data-fresh', state.ui.fresh ? 'true' : null) + '>';
    h += '<div class="card-top"><span>' + (i + 1) + '. ' + esc(node.label) + '</span>' +
      (arrivalNote(step) ? '<span>· ' + esc(arrivalNote(step)) + '</span>' : '') +
      '<span class="spacer"></span>' +
      (i > 0 ? '<button type="button" class="btn-text" data-action="rewind" data-role="back"' + attr('data-index', i - 1) + '>' + esc(UI_TEXT.back) + '</button>' : '') +
      '<button type="button" class="btn-text" data-action="toggle-stage" data-role="other-questions"' + attr('aria-expanded', state.ui.stageOpen ? 'true' : 'false') + '>' + esc(UI_TEXT.otherQuestions) + '</button>' +
      '</div>';
    if (node.risk === 'elevated' || node.risk === 'critical') h += '<div data-role="risk-line"' + attr('data-risk', node.risk) + '>' + esc(UI_TEXT.riskLine[node.risk]) + '</div>';
    h += '<h2 data-role="prompt">' + esc(node.prompt) + '</h2>';
    if (revisiting) h += '<p data-role="revisit-line">' + esc(fmt(UI_TEXT.revisit, { n: i + 1 })) + '</p>';

    if (node.terminal) {
      h += '<div data-role="end-card"><h3>' + esc(UI_TEXT.endTitle) + '</h3><p>' + esc(UI_TEXT.endHint) + '</p>' +
        '<button type="button" class="btn-dark" data-action="reset">' + esc(UI_TEXT.newCall) + '</button></div>';
    } else {
      h += '<div data-role="fork"><div data-role="answers"' + attr('data-count', node.answers.length) + '>';
      node.answers.forEach(function (a, k) {
        var prev = revisiting && step.answer === a.label;
        h += '<button type="button" data-role="answer" data-action="answer"' + attr('data-index', k) + attr('data-previous', prev ? 'true' : null) + '>' +
          '<span>' + esc(a.label) + '</span>' + (prev ? '<span class="prev">' + esc(UI_TEXT.previously) + '</span>' : '') + '</button>';
      });
      h += '</div></div>';
      h += '<div data-role="other-ways">';
      if (node.id !== stage.noneOfTheseNodeId) h += '<button type="button" class="btn-text" data-action="none-of-these" data-role="none-of-these">' + esc(UI_TEXT.noneOfThese) + '</button>';
      h += '<button type="button" class="btn-text" data-action="later" data-role="later">' + esc(UI_TEXT.later) + '</button>';
      h += '</div>';
    }

    if (state.ui.stageOpen) h += renderStageQuestions(node, stage);

    if (state.coaching && (node.why || (node.dialogue && node.dialogue.length))) {
      h += '<div data-role="coaching">';
      if (node.why) h += '<section><h3>' + esc(UI_TEXT.coachingWhy) + '</h3><p>' + esc(node.why) + '</p></section>';
      if (node.dialogue && node.dialogue.length) {
        h += '<section><h3>' + esc(UI_TEXT.coachingExample) + '</h3><ul data-role="dialogue">';
        node.dialogue.forEach(function (d) { h += '<li' + attr('data-who', d.who) + '><span class="who">' + esc(UI_TEXT.speakers[d.who] || d.who) + '</span>' + esc(d.text) + '</li>'; });
        h += '</ul></section>';
      }
      h += '</div>';
    }

    if (state.ui.feedbackOpen) h += renderFeedbackForm();
    else h += '<p data-role="feedback-row"><button type="button" class="btn-text small" data-action="toggle-feedback" data-role="feedback-link">' + esc(UI_TEXT.feedbackLink) + '</button></p>';

    return h + '</article>';
  }

  function renderStageQuestions(node, stage) {
    var h = '<section data-role="stage-questions">';
    h += '<header><h3>' + esc(stage.label) + '</h3>' +
      '<button type="button" class="btn-text" data-action="toggle-stage">' + esc(UI_TEXT.close) + '</button></header>' +
      '<p class="muted">' + esc(UI_TEXT.otherQuestionsHint) + '</p><ul>';
    FLOW.nodes.filter(function (n) { return n.stageId === stage.id; }).forEach(function (n) {
      var here = n.id === node.id;
      h += '<li><button type="button" data-role="stage-question" data-action="jump" data-via="jumped"' + attr('data-node-id', n.id) + attr('aria-current', here ? 'true' : null) + (here ? ' disabled' : '') + '>' +
        '<span class="risk-mark"' + attr('data-risk', n.risk) + '></span><span>' + esc(n.label) + (here ? ' <span class="muted">(' + esc(UI_TEXT.youAreHere) + ')</span>' : '') + '</span></button></li>';
    });
    return h + '</ul></section>';
  }

  function renderFeedbackForm() {
    var h = '<form data-role="feedback-form" data-action="send-feedback"><h3>' + esc(UI_TEXT.feedbackTitle) + '</h3><fieldset>';
    Object.keys(UI_TEXT.feedbackKinds).forEach(function (k, i) {
      h += '<label><input type="radio" name="kind"' + attr('value', k) + (i === 0 ? ' checked' : '') + '> ' + esc(UI_TEXT.feedbackKinds[k]) + '</label>';
    });
    h += '</fieldset><textarea name="comment" rows="2"' + attr('placeholder', UI_TEXT.feedbackPlaceholder) + '></textarea>';
    h += '<div class="row"><button type="submit" class="btn-dark">' + esc(UI_TEXT.feedbackSend) + '</button>' +
      '<button type="button" class="btn-text" data-action="toggle-feedback">' + esc(UI_TEXT.feedbackCancel) + '</button></div></form>';
    return h;
  }

  /* ---- guidance: the right half ---- */
  function renderGuide() {
    var node = currentNode();
    var h = '<aside data-role="guide"><h2>' + esc(UI_TEXT.guideTitle) + '</h2><p>' + esc(fmt(UI_TEXT.guideFor, { topic: node.label })) + '</p>';
    var any = false;
    ['never', 'escalate', 'ask', 'watch', 'resource'].forEach(function (type) {
      var blocks = node.content.filter(function (c) { return c.type === type; });
      if (!blocks.length) return;
      any = true;
      h += '<section data-role="guide-group"' + attr('data-type', type) + '><h3>' + esc(UI_TEXT.groups[type]) + '</h3><ul>';
      blocks.forEach(function (b) {
        h += '<li data-role="guide-item">' + (type === 'resource' ? '<a' + attr('href', b.url || '#') + '>' + esc(b.text) + '</a>' : esc(b.text)) + '</li>';
      });
      h += '</ul></section>';
    });
    if (!any) h += '<p data-role="guide-empty">' + esc(UI_TEXT.guideEmpty) + '</p>';
    return h + '</aside>';
  }

  /* ---- footer and behind the scenes ---- */
  function renderFoot() {
    var h = '<footer data-role="foot"><span>' + esc(UI_TEXT.keysHint) + '</span><span>' + esc(fmt(UI_TEXT.contentVersion, { v: FLOW.meta.contentVersion })) + '</span><span class="spacer"></span>' +
      '<button type="button" class="btn-text small" data-action="toggle-debug" data-role="debug-toggle"' + attr('aria-expanded', state.ui.debugOpen ? 'true' : 'false') + '>' + esc(UI_TEXT.behind) + (state.feedback.length ? ' (' + state.feedback.length + ')' : '') + '</button>';
    if (state.ui.debugOpen) h += renderDebug();
    return h + '</footer>';
  }

  function renderDebug() {
    var c = counts();
    var h = '<section data-role="debug"><p>' + esc(fmt(UI_TEXT.behindSummary, c)) + '</p>';
    h += '<h3>' + esc(UI_TEXT.behindFeedback) + '</h3>';
    if (!state.feedback.length) h += '<p class="muted">' + esc(UI_TEXT.behindFeedbackEmpty) + '</p>';
    else {
      h += '<ul data-role="feedback-list">';
      state.feedback.forEach(function (f) {
        h += '<li><strong>' + esc(NODES[f.question].label) + '</strong> · ' + esc(UI_TEXT.feedbackKinds[f.kind]) + (f.comment ? '<br>' + esc(f.comment) : '') + '<br><span class="muted small">' + esc(f.question) + ' · ' + esc(f.at) + '</span></li>';
      });
      h += '</ul>';
    }
    h += '<h3>' + esc(UI_TEXT.behindLog) + '</h3><ol data-role="event-log">';
    state.log.slice().reverse().forEach(function (e) {
      h += '<li><span class="muted">' + esc(e.at.slice(11, 23)) + '</span><span class="ev-type">' + esc(e.type) + '</span><span>' + esc(JSON.stringify(e.detail)) + '</span></li>';
    });
    h += '</ol>';
    var view = { cursor: state.cursor, path: state.path, stale: state.stale ? { changedAt: state.stale.changedAt, reason: state.stale.reason, steps: state.stale.steps } : null, coaching: state.coaching };
    h += '<h3>' + esc(UI_TEXT.behindState) + '</h3><pre data-role="state-json">' + esc(JSON.stringify(view, null, 2)) + '</pre>';
    return h + '</section>';
  }

  /* ---------------------------------------------------------- */
  /* Events: delegated; handlers only translate to actions       */
  /* ---------------------------------------------------------- */
  var root = document.getElementById('app');

  root.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]');
    if (!el || el.tagName === 'FORM') return;
    var action = el.getAttribute('data-action');
    switch (action) {
      case 'answer': dispatch({ type: 'answer', index: Number(el.getAttribute('data-index')) }); break;
      case 'jump': dispatch({ type: 'jump', nodeId: el.getAttribute('data-node-id'), via: el.getAttribute('data-via') }); break;
      case 'rewind': if (el.hasAttribute('data-index')) dispatch({ type: 'rewind', index: Number(el.getAttribute('data-index')) }); break;
      default: dispatch({ type: action }); break;
    }
  });

  root.addEventListener('input', function (ev) {
    if (ev.target.getAttribute('data-role') === 'search-input') dispatch({ type: 'search', value: ev.target.value });
  });

  root.addEventListener('submit', function (ev) {
    var form = ev.target.closest('form[data-action="send-feedback"]');
    if (!form) return;
    ev.preventDefault();
    var kind = form.querySelector('input[name="kind"]:checked');
    dispatch({ type: 'send-feedback', kind: kind ? kind.value : Object.keys(UI_TEXT.feedbackKinds)[0], comment: form.querySelector('textarea[name="comment"]').value.trim() });
  });

  root.addEventListener('keydown', function (ev) {
    if (ev.target.getAttribute && ev.target.getAttribute('data-role') === 'search-input' && ev.key === 'Enter') {
      var first = searchNodes(state.ui.search)[0];
      if (first) { ev.preventDefault(); dispatch({ type: 'jump', nodeId: first.id, via: 'searched' }); }
    }
  });

  document.addEventListener('keydown', function (ev) {
    var t = ev.target;
    var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
    if (ev.key === 'Escape') { if (typing) t.blur(); dispatch({ type: 'close-panels' }); return; }
    if (typing) return;
    if (/^[1-9]$/.test(ev.key) && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
      var node = currentNode();
      var i = Number(ev.key) - 1;
      if (!node.terminal && node.answers[i]) { ev.preventDefault(); dispatch({ type: 'answer', index: i }); }
    }
  });

  logEvent('visit', { question: FLOW.startNodeId, via: 'start', step: 1 });
  render();

  // Exposed for the smoke test and for poking at in the console.
  window.__frd = { getState: function () { return JSON.parse(JSON.stringify(state)); }, flow: FLOW, dispatch: dispatch };
})();
</script>
</body>
</html>
