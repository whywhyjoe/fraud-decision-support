<title>Fraud call guide — BMO look, demo (placeholder content)</title>
<!--
  Fraud call guide: click-through demo, BMO look and feel.
  The same demo as fraud-decision-support.html, restyled in the BMO
  SharePoint design system's colours, elevation and motion, with a richer
  guidance column (formatted briefs, step graphics, document thumbnails).
  Single self-contained file: no build, no network, no storage.
  Layout of this file:
    1. <style>    every design value is a custom property in :root
    2. #flow-data ALL content, one JSON object (see the fence below)
    3. sprite     icons and the roundel, referenced by <use>
    4. #app       empty shell, filled by render()
    5. <script>   state, reducer, pure render
-->
<style>
/* ============================================================ */
/* Design tokens. The only place a raw value may appear.         */
/* BMO palette from the BMO SharePoint design system. Blue is    */
/* the brand and interactive colour; red, amber and green stay   */
/* reserved for risk; BMO red appears only in the roundel.       */
/* Nothing on the page is smaller than --fs-small.               */
/* ============================================================ */
:root {
  --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;

  --fs-small: 14px;
  --fs-body: 16px;
  --fs-lead: 18px;
  --fs-h1: 20px;
  --fs-hero: 28px;
  --fs-guide-h: 20px;
  --fs-prompt: 26px;
  --fw-regular: 400;
  --fw-semibold: 600;
  --lh-body: 1.5;
  --lh-tight: 1.25;

  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;

  --radius: 10px;
  --radius-lg: 14px;
  --radius-sm: 4px;
  --radius-round: 999px;

  --bw: 1px;
  --bw-strong: 2px;
  --bw-line: 2px;

  /* BMO brand colours */
  --bmo-red: #ed1c24;            /* roundel only, never UI */
  --bmo-blue: #0079c1;
  --bmo-blue-hover: #005587;
  --bmo-blue-pressed: #003758;
  --bmo-focus: #73c3eb;
  --bmo-midnight: #003758;
  --bmo-navy: #005789;
  --bmo-sky: #00a9fb;
  --bmo-ice: #b1e5fe;
  --bmo-pale-sky: #c1e7ff;
  --bmo-slate: #001928;
  --bmo-granite: #646c76;
  --bmo-albicant: #f5f6f7;
  --bmo-light-grey: #d9dce1;
  --white: #ffffff;

  /* roles */
  --surface-canvas: #f4f6f8;
  --surface-raised: var(--white);
  --surface-subtle: var(--bmo-albicant);
  --surface-tint-blue: #edf3f9;
  --surface-tint-sky: #e4eef6;
  --surface-selected: #ebf3fc;
  --fg-primary: var(--bmo-slate);
  --fg-secondary: var(--bmo-granite);
  --fg-faint: #99a0a8;
  --fg-on-accent: var(--white);
  --fg-on-hero-2: var(--bmo-ice);
  --fg-heading: var(--bmo-midnight);
  --accent: var(--bmo-blue);
  --accent-hover: var(--bmo-blue-hover);
  --accent-pressed: var(--bmo-blue-pressed);
  --stroke-divider: var(--bmo-light-grey);
  --stroke-control: #bdbdbd;
  --stroke-focus: var(--bmo-focus);
  --line-flow: #8ab6d6;          /* the flow's connectors */
  --line-ahead: #c3c9d0;

  /* risk: the only red, amber and green on the page */
  --critical: #d12121;
  --critical-bg: #fbe6e6;
  --critical-line: #f1c9c9;
  --elevated: #8a6d00;
  --elevated-bg: #fff6e1;
  --elevated-line: #f0dea6;

  /* elevation (Fluent 2 ramp, as the design system ships it) */
  --shadow-2: 0 0 2px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.14);
  --shadow-4: 0 0 2px rgba(0,0,0,.12), 0 2px 4px rgba(0,0,0,.14);
  --shadow-8: 0 0 2px rgba(0,0,0,.12), 0 4px 8px rgba(0,0,0,.14);
  --shadow-16: 0 0 2px rgba(0,0,0,.12), 0 8px 16px rgba(0,0,0,.14);
  --shadow-hero: 0 2px 4px rgba(0,25,40,.10), 0 12px 28px rgba(0,55,88,.28);
  --shadow-ghost: 4px 4px 0 -1px var(--white), 4px 4px 0 0 var(--bmo-light-grey), 8px 8px 0 -1px var(--white), 8px 8px 0 0 var(--bmo-light-grey);

  /* motion: functional, one-shot, honours reduced motion */
  --motion-fast: 100ms;
  --motion-normal: 160ms;
  --motion-slow: 250ms;
  --motion-reveal: 550ms;
  --ease-out: cubic-bezier(0, 0, .2, 1);
  --ease-in-out: cubic-bezier(.4, 0, .2, 1);
  --rise: 14px;
  --lift: 3px;
  --lift-sm: 2px;
  --slide-in: 24px;
  --stagger: 60ms;

  /* hero */

  --hero-photo-w: 46%;
  --hero-photo-pos: 50% 40%;
  --hero-gradient: linear-gradient(100deg, var(--bmo-midnight) 0%, var(--bmo-navy) 48%, var(--bmo-blue) 100%);

  --hero-glow: radial-gradient(circle, rgba(255,255,255,.14) 0%, rgba(255,255,255,.05) 55%, rgba(255,255,255,0) 70%);
  --hero-glow-2: radial-gradient(circle, rgba(177,229,254,.20) 0%, rgba(177,229,254,0) 68%);
  --bokeh-1: 260px;
  --bokeh-2: 150px;
  --roundel: 52px;
  --overlap: 28px;

  /* icons, markers, thumbnails */
  --icon: 20px;
  --icon-lg: 24px;
  --badge: 40px;
  --dot: 14px;
  --bullet: 7px;
  --step-dot: 34px;
  --thumb-h: 132px;
  --thumb-line: 6px;
  --thumb-bar: 10px;
  --thumb-pad: 10px;
  --thumb-dot: 5px;
  --play: 44px;
  --fold: 14px;
  --page-ratio: 3 / 4;
  --slide-ratio: 16 / 9;
  --w-90: 90%;
  --w-75: 75%;
  --w-60: 60%;
  --w-45: 45%;
  --w-35: 35%;
  --bar-1: 45%;
  --bar-2: 70%;
  --bar-3: 55%;
  --bar-4: 90%;
  --bullet-top: 0.53em;
  --pic-gradient: linear-gradient(160deg, var(--bmo-pale-sky), var(--bmo-blue));
  --fold-gradient: linear-gradient(225deg, var(--surface-tint-sky) 50%, var(--bmo-light-grey) 50%);
  --video-gradient: radial-gradient(circle at 70% 35%, var(--bmo-navy), var(--bmo-midnight) 60%, var(--bmo-slate));
  --video-track: rgba(255,255,255,.25);

  --page-max: 1280px;
  --page-min: 900px;
  --banner-h: 36px;
  --control-h: 40px;
  --answer-h: 64px;
  --search-w: 320px;
  --dropdown-max-h: 420px;
  --spine-x: 28px;        /* where the flow's vertical line runs */
  --edge-h: 40px;         /* height of a connector between two steps */
  --fork-gap: 20px;       /* vertical gap between the question and its answers */
  --answer-gap: 16px;
  --quarter: 25%;
  --half: 50%;
  --full: 100%;
  --dim: 0.55;
  --z-banner: 50;
  --z-drop: 40;
  --z-lift: 2;
  --z-over: 1;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--fg-primary);
  background: var(--surface-canvas);
  padding-top: var(--banner-h);
}
h1, h2, h3, h4 { margin: 0; line-height: var(--lh-tight); font-weight: var(--fw-semibold); color: var(--fg-heading); }
h1 { font-size: var(--fs-h1); }
h2 { font-size: var(--fs-prompt); }
h3 { font-size: var(--fs-body); }
p { margin: 0 0 var(--s-3) 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
a { color: var(--accent); }
a:hover { color: var(--accent-hover); }
strong { font-weight: var(--fw-semibold); }
.icon { width: var(--icon); height: var(--icon); flex: none; vertical-align: middle; }
.sprite { display: none; }
button {
  font: inherit;
  color: var(--fg-primary);
  cursor: pointer;
  background: var(--surface-raised);
  border: var(--bw) solid var(--stroke-control);
  border-radius: var(--radius);
  padding: var(--s-2) var(--s-4);
  min-height: var(--control-h);
  transition: background-color var(--motion-fast) var(--ease-out), border-color var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out), box-shadow var(--motion-normal) var(--ease-out), transform var(--motion-normal) var(--ease-out);
}
button:hover { background: var(--surface-selected); border-color: var(--accent); color: var(--accent-hover); }
button:active { background: var(--surface-tint-sky); }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
  outline: var(--bw-strong) solid var(--stroke-focus);
  outline-offset: var(--bw-strong);
}
input, textarea {
  font: inherit;
  color: inherit;
  border: var(--bw) solid var(--stroke-control);
  border-radius: var(--radius);
  padding: var(--s-2) var(--s-3);
  background: var(--surface-raised);
  min-height: var(--control-h);
  transition: border-color var(--motion-fast) var(--ease-out);
}
input:focus, textarea:focus { border-color: var(--accent); }
[hidden] { display: none !important; }
.muted { color: var(--fg-secondary); }
.small { font-size: var(--fs-small); }
.btn-dark { background: var(--accent); color: var(--fg-on-accent); border-color: var(--accent); font-weight: var(--fw-semibold); }
.btn-dark:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--fg-on-accent); }
.btn-dark:active { background: var(--accent-pressed); }
.btn-text { border-color: transparent; background: transparent; color: var(--accent); padding-left: var(--s-2); padding-right: var(--s-2); }
.btn-text:hover { background: var(--surface-selected); border-color: transparent; text-decoration: underline; }
.btn-toggle[aria-pressed="true"] { background: var(--accent); color: var(--fg-on-accent); border-color: var(--accent); }
.row { display: flex; gap: var(--s-3); align-items: center; flex-wrap: wrap; }

/* ---------- placeholder banner ---------- */
[data-role="placeholder-banner"] {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--banner-h);
  z-index: var(--z-banner);
  background: var(--bmo-slate);
  color: var(--white);
  font-weight: var(--fw-semibold);
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-4);
}

/* ---------- page grid: two equal columns ---------- */
[data-role="shell"] {
  max-width: var(--page-max);
  min-width: var(--page-min);
  margin: 0 auto;
  padding: var(--s-5) var(--s-5) var(--s-7);
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-areas: "top top" "path guide" "foot foot";
  column-gap: var(--s-6);
  row-gap: var(--s-5);
}
[data-role="top"] { grid-area: top; }
[data-role="path"] { grid-area: path; }
[data-role="guide"] { grid-area: guide; }
[data-role="foot"] { grid-area: foot; }
@media (max-width: 1000px) {
  [data-role="shell"] { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "path" "guide" "foot"; }
  :root { --hero-photo-w: 36%; }
}

/* ---------- brand header: short, blue, roundel and photo ---------- */
[data-role="brand-bar"] {
  position: relative;
  overflow: hidden;
  min-height: var(--hero-h);
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-5) var(--s-6) calc(var(--s-5) + var(--overlap));
  border-radius: var(--radius-lg);
  background: var(--hero-gradient);
  color: var(--white);
  box-shadow: var(--shadow-hero);
}
[data-role="brand-bar"]::before, [data-role="brand-bar"]::after {
  content: ""; position: absolute; border-radius: var(--radius-round); pointer-events: none;
}
[data-role="brand-bar"]::before { width: var(--bokeh-1); height: var(--bokeh-1); left: calc(var(--bokeh-2) * -0.6); top: calc(var(--bokeh-2) * -0.9); background: var(--hero-glow); }
[data-role="brand-bar"]::after { width: var(--bokeh-2); height: var(--bokeh-2); left: var(--w-35); bottom: calc(var(--bokeh-2) * -0.55); background: var(--hero-glow-2); }
[data-role="hero-photo"] {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: var(--hero-photo-w);
  background: var(--hero-photo) var(--hero-photo-pos) / cover no-repeat;
  -webkit-mask-image: var(--hero-mask);
  mask-image: var(--hero-mask);
}
[data-role="roundel"] { width: var(--roundel); height: var(--roundel); flex: none; position: relative; z-index: var(--z-over); filter: drop-shadow(var(--shadow-4)); }
.roundel-disc { fill: var(--bmo-red); }
.roundel-mark { fill: var(--white); }
[data-role="brand-text"] { position: relative; z-index: var(--z-over); max-width: calc(var(--full) - var(--hero-photo-w)); }
[data-role="brand-text"] h1 { font-size: var(--fs-hero); color: var(--white); }
[data-role="brand-text"] p { margin: var(--s-1) 0 0; color: var(--fg-on-hero-2); font-size: var(--fs-lead); }

/* ---------- toolbar, floating over the header's lower edge ---------- */
[data-role="header-row"] {
  position: relative; z-index: var(--z-lift);
  margin: calc(var(--overlap) * -1) var(--s-5) 0;
  display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
  padding: var(--s-3) var(--s-4);
  background: var(--surface-raised);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-8);
}
[data-role="header-row"] .spacer { flex: 1; }
[data-role="search"] { position: relative; }
[data-role="search"] .icon { position: absolute; left: var(--s-3); top: var(--half); transform: translateY(calc(var(--half) * -1)); color: var(--fg-secondary); pointer-events: none; }
[data-role="search"] input { width: var(--search-w); padding-left: calc(var(--s-3) + var(--icon) + var(--s-2)); background: var(--surface-subtle); }
[data-role="search"] input:focus { background: var(--surface-raised); }
[data-role="search-results"] {
  position: absolute; top: var(--full); left: 0; width: var(--search-w);
  z-index: var(--z-drop);
  margin-top: var(--s-1);
  background: var(--surface-raised);
  border: var(--bw) solid var(--stroke-divider);
  border-radius: var(--radius);
  box-shadow: var(--shadow-16);
  max-height: var(--dropdown-max-h);
  overflow: auto;
}
[data-role="search-result"], .search-empty {
  display: block; width: var(--full); text-align: left;
  border: 0; border-radius: 0; border-bottom: var(--bw) solid var(--stroke-divider);
  padding: var(--s-3) var(--s-4);
}
[data-role="search-result"] span { display: block; color: var(--fg-secondary); font-size: var(--fs-small); }
.search-empty { color: var(--fg-secondary); }

/* ---------- the flow ---------- */
/* One vertical spine at --spine-x. Boxes sit to its right; connectors
   between boxes carry the answer that was chosen, like a labelled edge. */
[data-role="flow"] { position: relative; padding-left: var(--s-2); }
[data-role="flow"] > li { position: relative; }

[data-role="stage-label"] {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-2) 0;
  font-weight: var(--fw-semibold);
  color: var(--fg-heading);
}
[data-role="stage-label"]::before {
  content: ""; flex: none;
  width: var(--dot); height: var(--dot);
  margin-left: calc(var(--spine-x) - var(--dot) / 2 + var(--bw-line) / 2);
  border-radius: var(--radius-round);
  background: var(--accent);
  box-shadow: 0 0 0 var(--s-1) var(--surface-selected);
}
[data-role="stage-label"]::after { content: ""; flex: 1; border-top: var(--bw) solid var(--stroke-divider); }
[data-role="stage-label"][data-state="ahead"] { color: var(--fg-faint); }
[data-role="stage-label"][data-state="ahead"]::before { background: var(--surface-canvas); border: var(--bw-line) solid var(--line-ahead); box-shadow: none; }
[data-role="stage-label"] + li { margin-top: var(--s-2); }

[data-role="edge"] {
  height: var(--edge-h);
  display: flex; align-items: center;
  padding-left: calc(var(--spine-x) + var(--s-4));
  position: relative;
  color: var(--fg-secondary);
}
[data-role="edge"]::before {
  content: ""; position: absolute; left: var(--spine-x); top: 0; bottom: 0;
  border-left: var(--bw-line) solid var(--line-flow);
}
[data-role="edge"] span { background: var(--surface-canvas); padding: 0 var(--s-2); }
[data-role="edge"][data-state="ahead"]::before, [data-role="edge"][data-state="stale"]::before { border-left-style: dashed; border-left-color: var(--line-ahead); }
[data-role="edge"][data-state="ahead"], [data-role="edge"][data-state="stale"] { color: var(--fg-faint); }
[data-role="edge"][data-state="stale"] span { text-decoration: line-through; }

[data-role="step-box"] {
  width: var(--full); text-align: left;
  display: flex; align-items: baseline; gap: var(--s-3); flex-wrap: wrap;
  padding: var(--s-3) var(--s-4);
  background: var(--surface-raised);
  border-color: var(--stroke-divider);
  box-shadow: var(--shadow-2);
}
[data-role="step-box"] strong { color: var(--fg-primary); }
[data-role="step-box"]:hover strong { color: var(--accent-hover); }
[data-role="step-box"] .step-note { color: var(--fg-secondary); width: var(--full); }
[data-role="step"][data-state="ahead"] [data-role="step-box"], [data-role="step"][data-state="stale"] [data-role="step-box"] { opacity: var(--dim); border-style: dashed; box-shadow: none; }
[data-role="step"][data-state="stale"] [data-role="step-box"] { text-decoration: line-through; }

[data-role="stale-notice"] {
  display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
  padding: var(--s-3) var(--s-4);
  background: var(--surface-tint-sky);
  border-radius: var(--radius);
  margin: var(--s-4) 0;
  box-shadow: var(--shadow-2);
}
[data-role="stale-notice"] strong { font-size: var(--fs-lead); color: var(--fg-heading); }
[data-role="stale-notice"] .row { margin-left: auto; }

/* the current question */
[data-role="question-card"] {
  background: var(--surface-raised);
  border: var(--bw) solid var(--stroke-divider);
  border-radius: var(--radius-lg);
  padding: 0 var(--s-5) var(--s-5);
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-16);
}
[data-role="question-card"] .card-top {
  display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
  margin: 0 calc(var(--s-5) * -1) var(--s-4);
  padding: var(--s-2) var(--s-4) var(--s-2) var(--s-5);
  background: var(--surface-tint-blue);
  border-bottom: var(--bw) solid var(--stroke-divider);
  color: var(--fg-heading);
  font-weight: var(--fw-semibold);
}
[data-role="question-card"] .card-top .muted { font-weight: var(--fw-regular); }
[data-role="question-card"] .card-top .spacer { flex: 1; }
[data-role="prompt"] { color: var(--fg-primary); }
[data-role="risk-line"] {
  display: flex; align-items: center; gap: var(--s-2);
  border-radius: var(--radius);
  padding: var(--s-2) var(--s-4);
  font-weight: var(--fw-semibold);
  margin-bottom: var(--s-4);
  border: var(--bw) solid transparent;
}
[data-role="risk-line"][data-risk="elevated"] { background: var(--elevated-bg); color: var(--elevated); border-color: var(--elevated-line); }
[data-role="risk-line"][data-risk="critical"] { background: var(--critical-bg); color: var(--critical); border-color: var(--critical-line); }
[data-role="revisit-line"] { color: var(--fg-secondary); margin-top: var(--s-3); }

/* answers: a two-column fork hanging off the question box */
[data-role="fork"] { margin-top: var(--s-4); }
[data-role="answers"] {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--answer-gap);
  padding-top: var(--fork-gap);
  margin-top: var(--fork-gap);
}
[data-role="answers"]::after {            /* stem down from the question */
  content: ""; position: absolute; left: var(--half); top: calc(var(--fork-gap) * -1); height: var(--fork-gap);
  border-left: var(--bw-line) solid var(--line-flow);
}
[data-role="answers"]::before {           /* bar across the two columns */
  content: ""; position: absolute; top: 0; left: var(--quarter); right: var(--quarter);
  border-top: var(--bw-line) solid var(--line-flow);
}
[data-role="answer"] { position: relative; }
[data-role="answer"]::before {            /* stub from the bar, or from the answer above */
  content: ""; position: absolute; left: var(--half); top: calc(var(--fork-gap) * -1); height: var(--fork-gap);
  border-left: var(--bw-line) solid var(--line-flow);
}
[data-role="answer"]:nth-child(n+3)::before { top: calc(var(--answer-gap) * -1); height: var(--answer-gap); }
[data-role="answers"][data-count="1"] { grid-template-columns: 1fr; padding-top: 0; }
[data-role="answers"][data-count="1"]::before { display: none; }
[data-role="answers"][data-count="1"] [data-role="answer"]::before { display: none; }
[data-role="answer"] {
  min-height: var(--answer-h);
  text-align: center;
  font-size: var(--fs-lead);
  font-weight: var(--fw-semibold);
  color: var(--fg-heading);
  padding: var(--s-3) var(--s-4);
  border: var(--bw-strong) solid var(--bmo-light-grey);
  background: var(--surface-raised);
  box-shadow: var(--shadow-2);
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: var(--s-1);
}
[data-role="answer"]:hover { border-color: var(--accent); box-shadow: var(--shadow-8); }
[data-role="answer"][data-previous="true"] { background: var(--surface-selected); border-color: var(--accent); }
[data-role="answer"] .prev { color: var(--fg-secondary); font-size: var(--fs-small); font-weight: var(--fw-regular); }
[data-role="other-ways"] { display: flex; gap: var(--s-2); flex-wrap: wrap; align-items: center; color: var(--fg-secondary); margin-top: var(--s-4); }

[data-role="end-card"] { display: flex; gap: var(--s-4); align-items: flex-start; background: var(--surface-tint-blue); border-radius: var(--radius); padding: var(--s-4) var(--s-5); margin-top: var(--s-4); }
[data-role="end-card"] .badge { background: var(--accent); color: var(--fg-on-accent); }
[data-role="end-card"] h3 { font-size: var(--fs-lead); margin-bottom: var(--s-1); }
[data-role="end-card"] p { margin-bottom: var(--s-3); }

/* other questions in this stage, opened from the card */
[data-role="stage-questions"] { margin-top: var(--s-4); padding-top: var(--s-4); border-top: var(--bw) solid var(--stroke-divider); }
[data-role="stage-questions"] header { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-3); }
[data-role="stage-questions"] header h3 { margin-right: auto; }
[data-role="stage-questions"] ul { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); }
[data-role="stage-question"] { width: var(--full); text-align: left; display: flex; gap: var(--s-3); align-items: center; }
[data-role="stage-question"][aria-current="true"] { background: var(--surface-selected); border-color: var(--surface-selected); cursor: default; color: var(--fg-heading); }
[data-role="stage-question"] .risk-mark { flex: none; width: var(--s-3); height: var(--s-3); border-radius: var(--radius-round); background: var(--line-ahead); }
[data-role="stage-question"] .risk-mark[data-risk="elevated"] { background: var(--elevated); }
[data-role="stage-question"] .risk-mark[data-risk="critical"] { background: var(--critical); }

[data-role="coaching"] { margin: var(--s-5) calc(var(--s-5) * -1) 0; padding: var(--s-4) var(--s-5); background: var(--surface-subtle); border-top: var(--bw) solid var(--stroke-divider); border-bottom: var(--bw) solid var(--stroke-divider); }
[data-role="coaching"] h3 { margin-bottom: var(--s-2); }
[data-role="coaching"] section + section { margin-top: var(--s-4); }
[data-role="dialogue"] li { padding: var(--s-2) var(--s-4); border-radius: var(--radius); margin-bottom: var(--s-2); background: var(--surface-raised); box-shadow: var(--shadow-2); margin-right: var(--s-7); }
[data-role="dialogue"] li[data-who="customer"] { background: var(--surface-tint-blue); margin-right: 0; margin-left: var(--s-7); }
[data-role="dialogue"] .who { font-weight: var(--fw-semibold); margin-right: var(--s-2); color: var(--fg-heading); }

[data-role="feedback-row"] { margin-top: var(--s-4); margin-bottom: 0; }
[data-role="feedback-form"] { margin-top: var(--s-4); padding: var(--s-4) var(--s-5); background: var(--surface-subtle); border-radius: var(--radius); }
[data-role="feedback-form"] h3 { margin-bottom: var(--s-3); }
[data-role="feedback-form"] fieldset { border: 0; padding: 0; margin: 0 0 var(--s-3); display: flex; gap: var(--s-4); flex-wrap: wrap; }
[data-role="feedback-form"] textarea { width: var(--full); margin-bottom: var(--s-3); }

/* ---------- guidance: the other half of the screen ---------- */
[data-role="guide"] {
  background: var(--surface-raised);
  border: var(--bw) solid var(--stroke-divider);
  border-radius: var(--radius-lg);
  align-self: start;
  overflow: hidden;
  box-shadow: var(--shadow-8);
}
[data-role="guide-head"] {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-4) var(--s-5);
  background: var(--surface-tint-blue);
  border-bottom: var(--bw) solid var(--stroke-divider);
}
[data-role="guide-head"] h2 { font-size: var(--fs-guide-h); }
[data-role="guide-head"] p { margin: 0; color: var(--fg-secondary); }
.badge {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: var(--badge); height: var(--badge);
  border-radius: var(--radius-round);
  background: var(--accent); color: var(--fg-on-accent);
}
.badge .icon { width: var(--icon-lg); height: var(--icon-lg); }
[data-role="guide-body"] { padding: var(--s-5); }
[data-role="guide-body"] > section + section { margin-top: var(--s-5); }
[data-role="guide-group"] h3, [data-role="guide-steps"] h3 {
  display: flex; align-items: center; gap: var(--s-2);
  font-size: var(--fs-lead); margin-bottom: var(--s-3);
}
[data-role="guide-group"] h3 .icon { color: var(--accent); }
[data-role="guide-item"] {
  font-size: var(--fs-body);
  padding: var(--s-3) var(--s-4);
  border-radius: var(--radius);
  margin-bottom: var(--s-2);
  background: var(--surface-subtle);
  display: flex; gap: var(--s-3); align-items: flex-start;
}
[data-role="guide-item"] > .icon { margin-top: var(--bw-strong); color: var(--accent); }

/* the rich brief: a formatted heading, paragraph and bullets */
[data-role="guide-brief"] {
  padding: var(--s-4) var(--s-5);
  border-radius: var(--radius);
  background: var(--surface-tint-blue);
}
[data-role="guide-brief"] h3 { font-size: var(--fs-guide-h); margin-bottom: var(--s-2); }
[data-role="guide-brief"] p { font-size: var(--fs-lead); color: var(--fg-primary); }
[data-role="guide-brief"] p:last-child { margin-bottom: 0; }
[data-role="guide-brief"] ul li { position: relative; padding-left: var(--s-5); margin-top: var(--s-1); }
[data-role="guide-brief"] ul li::before {
  content: ""; position: absolute; left: var(--s-2); top: var(--bullet-top);
  width: var(--bullet); height: var(--bullet); border-radius: var(--radius-round); background: var(--accent);
}

[data-role="guide-group"][data-type="never"] [data-role="guide-item"] { background: var(--bmo-midnight); color: var(--white); font-weight: var(--fw-semibold); box-shadow: var(--shadow-4); }
[data-role="guide-group"][data-type="never"] [data-role="guide-item"] > .icon { color: var(--bmo-ice); }
[data-role="guide-group"][data-type="escalate"] h3, [data-role="guide-group"][data-type="escalate"] h3 .icon { color: var(--critical); }
[data-role="guide-group"][data-type="escalate"] [data-role="guide-item"] { background: var(--critical-bg); border: var(--bw) solid var(--critical-line); font-weight: var(--fw-semibold); }
[data-role="guide-group"][data-type="escalate"] [data-role="guide-item"] > .icon { color: var(--critical); }
[data-role="guide-group"][data-type="ask"] [data-role="guide-item"] { background: var(--surface-raised); border: var(--bw) solid var(--stroke-divider); }
[data-role="guide-group"][data-type="watch"] [data-role="guide-item"] { background: var(--surface-subtle); }

/* a step graphic: numbered circles joined by a line */
[data-role="guide-steps"] ol { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; gap: var(--s-2); }
[data-role="guide-steps"] li { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--s-2); }
[data-role="guide-steps"] li + li::before {
  content: ""; position: absolute; top: calc(var(--step-dot) / 2 - var(--bw-line) / 2); right: calc(var(--half) + var(--step-dot) / 2); width: calc(var(--full) - var(--step-dot) + var(--s-2));
  border-top: var(--bw-line) solid var(--line-flow);
}
[data-role="guide-steps"] .num {
  width: var(--step-dot); height: var(--step-dot);
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-round);
  background: var(--accent); color: var(--fg-on-accent); font-weight: var(--fw-semibold);
  box-shadow: 0 0 0 var(--s-1) var(--surface-selected);
}
[data-role="guide-steps"] li span:last-child { font-size: var(--fs-small); color: var(--fg-primary); }

/* resources: document cards with a drawn thumbnail */
[data-role="guide-group"][data-type="resource"] ul { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-4); }
[data-role="guide-group"][data-type="resource"] [data-role="guide-item"] { padding: 0; margin: 0; background: transparent; display: block; }
[data-role="doc"] {
  display: flex; flex-direction: column; height: var(--full);
  text-decoration: none;
  border: var(--bw) solid var(--stroke-divider);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface-raised);
  box-shadow: var(--shadow-2);
  transition: box-shadow var(--motion-normal) var(--ease-out), transform var(--motion-normal) var(--ease-out), border-color var(--motion-normal) var(--ease-out);
}
[data-role="doc"]:hover { box-shadow: var(--shadow-16); border-color: var(--line-flow); }
.doc-body { padding: var(--s-3) var(--s-4); display: flex; flex-direction: column; gap: var(--s-1); }
.doc-title { font-weight: var(--fw-semibold); color: var(--accent); }
[data-role="doc"]:hover .doc-title { color: var(--accent-hover); text-decoration: underline; }
.doc-meta { display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-small); color: var(--fg-secondary); }
.doc-meta .icon { color: var(--fg-secondary); }

/* thumbnails are drawn, not images: blocks and lines on tokens */
.thumb {
  height: var(--thumb-h);
  display: flex; align-items: center; justify-content: center;
  padding: var(--s-3);
  background: var(--surface-tint-sky);
  border-bottom: var(--bw) solid var(--stroke-divider);
  overflow: hidden;
}
.thumb i { display: block; border-radius: var(--radius-round); background: var(--bmo-light-grey); height: var(--thumb-line); }
.thumb .t-title { height: var(--thumb-bar); width: var(--w-60); background: var(--bmo-navy); }
.thumb .t-line { width: var(--w-90); margin-top: var(--thumb-line); }
.thumb .t-line.t-short { width: var(--w-60); }
.slide, .page, .frame { background: var(--white); box-shadow: var(--shadow-4); padding: var(--thumb-pad); display: flex; flex-direction: column; }
.slide { height: var(--full); aspect-ratio: var(--slide-ratio); border-radius: var(--radius-sm); box-shadow: var(--shadow-ghost), var(--shadow-4); }
.slide .t-body { flex: 1; display: flex; gap: var(--thumb-pad); margin-top: var(--thumb-pad); min-height: 0; }
.slide .t-col { flex: 1; }
.t-chart { flex: 1; display: flex; align-items: flex-end; gap: var(--thumb-dot); border-bottom: var(--bw) solid var(--bmo-light-grey); }
.thumb .t-chart i { flex: 1; height: var(--bar-1); border-radius: var(--radius-sm) var(--radius-sm) 0 0; background: var(--bmo-blue); }
.thumb .t-chart i:nth-child(2) { height: var(--bar-2); background: var(--bmo-navy); }
.thumb .t-chart i:nth-child(3) { height: var(--bar-3); background: var(--bmo-sky); }
.thumb .t-chart i:nth-child(4) { height: var(--bar-4); background: var(--bmo-midnight); }
.t-steps { flex: 1; display: flex; align-items: center; justify-content: space-between; position: relative; }
.t-steps::before { content: ""; position: absolute; left: var(--thumb-pad); right: var(--thumb-pad); top: var(--half); border-top: var(--bw-line) solid var(--bmo-pale-sky); }
.thumb .t-steps i { position: relative; width: var(--s-4); height: var(--s-4); background: var(--bmo-blue); }
.thumb .t-steps i:nth-child(2) { background: var(--bmo-navy); }
.thumb .t-steps i:nth-child(3) { background: var(--bmo-sky); }
.thumb .t-pic { flex: 1; border-radius: var(--radius-sm); height: auto; background: var(--pic-gradient); position: relative; }
.thumb .t-pic::after { content: ""; position: absolute; width: var(--s-3); height: var(--s-3); right: var(--thumb-pad); top: var(--thumb-dot); border-radius: var(--radius-round); background: var(--white); }
.page { height: var(--full); aspect-ratio: var(--page-ratio); border-radius: var(--radius-sm); position: relative; }
.page::after { content: ""; position: absolute; top: 0; right: 0; width: var(--fold); height: var(--fold); background: var(--fold-gradient); }
.page .t-title { width: var(--w-75); }
.page .t-line { width: var(--full); margin-top: var(--thumb-dot); height: var(--thumb-dot); }
.page .t-line.t-short { width: var(--w-60); }
.t-table { margin-top: var(--thumb-line); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--bw-strong); }
.thumb .t-table i { border-radius: 0; height: var(--thumb-line); background: var(--surface-tint-sky); }
.thumb .t-table i:nth-child(-n+3) { background: var(--bmo-blue); }
.t-form { margin-top: var(--thumb-line); display: flex; flex-direction: column; gap: var(--thumb-dot); }
.thumb .t-form i { height: var(--thumb-bar); background: var(--white); border: var(--bw) solid var(--bmo-light-grey); border-radius: var(--radius-sm); }
.thumb .t-form i:nth-child(odd) { width: var(--w-45); height: var(--thumb-dot); border: 0; background: var(--bmo-light-grey); }
.frame { height: var(--full); width: var(--w-90); border-radius: var(--radius-sm); padding: 0; overflow: hidden; }
.frame .t-chrome { display: flex; gap: var(--s-1); padding: var(--s-1) var(--s-2); background: var(--surface-subtle); border-bottom: var(--bw) solid var(--bmo-light-grey); }
.thumb .frame .t-chrome i { width: var(--thumb-dot); height: var(--thumb-dot); background: var(--stroke-control); }
.thumb .frame .t-band { height: var(--s-4); border-radius: 0; background: var(--hero-gradient); }
.frame .t-inner { padding: var(--thumb-dot) var(--s-2); }
.thumb .frame .t-search { height: var(--thumb-bar); width: var(--w-75); margin: var(--thumb-dot) 0; background: var(--white); border: var(--bw) solid var(--stroke-control); }
.thumb[data-format="video"] { background: var(--bmo-slate); padding: 0; }
.thumb[data-format="video"] .t-video { position: relative; width: var(--full); height: var(--full); background: var(--video-gradient); display: flex; align-items: center; justify-content: center; }
.thumb .t-video .t-play { width: var(--play); height: var(--play); background: var(--white); color: var(--accent); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-8); }
.thumb .t-video .t-play .icon { margin-left: var(--thumb-dot); }
.thumb .t-video .t-progress { position: absolute; left: var(--s-3); right: var(--s-3); bottom: var(--s-3); height: var(--thumb-dot); background: var(--video-track); }
.thumb .t-video .t-progress::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--w-35); border-radius: var(--radius-round); background: var(--bmo-sky); }
[data-role="guide-empty"] { color: var(--fg-secondary); }

/* ---------- footer and behind the scenes ---------- */
[data-role="foot"] { display: flex; gap: var(--s-4); align-items: center; flex-wrap: wrap; color: var(--fg-secondary); font-size: var(--fs-small); border-top: var(--bw) solid var(--stroke-divider); padding-top: var(--s-4); }
[data-role="foot"] .spacer { flex: 1; }
[data-role="debug"] { margin-top: var(--s-4); background: var(--surface-raised); border: var(--bw) solid var(--stroke-divider); border-radius: var(--radius-lg); padding: var(--s-5); width: var(--full); color: var(--fg-primary); font-size: var(--fs-body); box-shadow: var(--shadow-4); }
[data-role="debug"] h3 { margin: var(--s-4) 0 var(--s-2); }
[data-role="debug"] pre { font-family: var(--font-mono); font-size: var(--fs-small); background: var(--surface-subtle); border-radius: var(--radius); padding: var(--s-4); max-height: var(--dropdown-max-h); overflow: auto; white-space: pre-wrap; margin: 0; }
[data-role="event-log"] { font-family: var(--font-mono); font-size: var(--fs-small); max-height: var(--dropdown-max-h); overflow: auto; border: var(--bw) solid var(--stroke-divider); border-radius: var(--radius); }
[data-role="event-log"] li { display: flex; gap: var(--s-3); padding: var(--s-1) var(--s-3); border-bottom: var(--bw) solid var(--stroke-divider); }
[data-role="event-log"] .ev-type { font-weight: var(--fw-semibold); min-width: var(--s-7); }
[data-role="feedback-list"] li { padding: var(--s-3) var(--s-4); border: var(--bw) solid var(--stroke-divider); border-radius: var(--radius); margin-bottom: var(--s-2); }

/* ---------- motion: one-shot entrances and hover lift ---------- */
/* Everything that moves is inside this query, so reduced motion,
   print and a slow machine all get the finished layout. */
@media (prefers-reduced-motion: no-preference) {
  [data-role="step-box"]:hover, [data-role="answer"]:hover, [data-role="doc"]:hover { transform: translateY(calc(var(--lift) * -1)); }
  [data-role="stage-question"]:not([aria-current="true"]):hover { transform: translateY(calc(var(--lift-sm) * -1)); }
  [data-role="question-card"][data-fresh="true"] { animation: rise var(--motion-reveal) var(--ease-out) both; }
  [data-role="guide"][data-fresh="true"] [data-role="guide-body"] > section { animation: rise var(--motion-reveal) var(--ease-out) both; }
  [data-role="guide"][data-fresh="true"] [data-role="guide-body"] > section:nth-child(2) { animation-delay: var(--stagger); }
  [data-role="guide"][data-fresh="true"] [data-role="guide-body"] > section:nth-child(3) { animation-delay: calc(var(--stagger) * 2); }
  [data-role="guide"][data-fresh="true"] [data-role="guide-body"] > section:nth-child(4) { animation-delay: calc(var(--stagger) * 3); }
  [data-role="guide"][data-fresh="true"] [data-role="guide-body"] > section:nth-child(5) { animation-delay: calc(var(--stagger) * 4); }
  [data-role="guide"][data-fresh="true"] [data-role="guide-body"] > section:nth-child(n+6) { animation-delay: calc(var(--stagger) * 5); }
  [data-role="brand-bar"][data-intro="true"] [data-role="hero-photo"] { animation: slide-in var(--motion-reveal) var(--ease-out) both; }
  [data-role="brand-bar"][data-intro="true"] [data-role="brand-text"], [data-role="brand-bar"][data-intro="true"] [data-role="roundel"] { animation: rise var(--motion-reveal) var(--ease-out) both; }
  [data-role="header-row"][data-intro="true"] { animation: rise var(--motion-reveal) var(--ease-out) both; animation-delay: var(--stagger); }
}
@keyframes rise { from { opacity: 0; transform: translateY(var(--rise)); } to { opacity: 1; transform: none; } }
@keyframes slide-in { from { opacity: 0; transform: translateX(var(--slide-in)); } to { opacity: 1; transform: none; } }
</style>

  ],

  "startNodeId": "verify-open",

  "nodes": [

    {
      "id": "verify-open", "stageId": "verify", "label": "Identity verification", "risk": null,
      "prompt": "Has the caller passed identity verification?",
      "why": "Nothing about the account can be discussed until verification passes. Most of the damage in a fraud call happens in the first minute, when a rep sympathises with an upset caller and skips a step.",
      "dialogue": [
        { "who": "rep", "text": "Thanks for calling. Before we look at anything, I need to confirm a few details with you." },
        { "who": "customer", "text": "Someone's spent money on my card, I just need it stopped!" },
        { "who": "rep", "text": "I understand, and we'll get to that straight away. First, can you confirm your full name and date of birth?" }

        { "type": "ask", "text": "Full name, date of birth, and two knowledge questions from the verification panel." },

        { "type": "never", "text": "Card number, balance or recent transactions disclosed before verification passes." },

        { "type": "resource", "text": "Verification refresher for new starters (placeholder)", "url": "#", "format": "deck", "thumb": "split", "meta": "Slides · 16 slides" },

    },
    {
      "id": "verify-partial", "stageId": "verify", "label": "Verification partially failed", "risk": null,
      "prompt": "Which check failed?",
      "why": "The type of failure matters more than the fact of it. A wrong knowledge answer is usually a nervous customer; a caller who does not know their own details is a different problem.",
      "dialogue": [
        { "who": "customer", "text": "I can't remember what I set as my memorable place, sorry." }

        { "type": "resource", "text": "Identity verification procedure (placeholder)", "url": "#", "format": "pdf", "thumb": "text", "meta": "PDF · 8 pages · updated Aug 2026" },
        { "type": "brief", "text": "Reading a partial failure", "body": "The **type** of failure matters more than the fact of it.", "points": ["Wrong knowledge answer: usually nerves", "Code not received: check the number on file", "Unsure of own details: a **coaching signal**"] }
      ],
      "answers": [
        { "label": "Knowledge question",              "nextNodeId": "verify-secondary" },
        { "label": "One-time code not received",           "nextNodeId": "verify-secondary" },
        { "label": "Caller unsure of own details", "nextNodeId": "verify-coached" }
      ]
    },
    {
      "id": "verify-secondary", "stageId": "verify", "label": "Secondary verification", "risk": null,
      "prompt": "Did callback verification to the number on file succeed?",
      "why": "A callback to a number we already hold is the cheapest strong check we have. It also quietly removes anyone who was on the original line.",
      "dialogue": [
        { "who": "rep", "text": "I'm going to call you back on the mobile number we have on file. It ends in the digits I'll read to you now." }
      ],
      "content": [
        { "type": "ask", "text": "That the caller can take a call on the number ending in the two digits read out." },
        { "type": "never", "text": "A callback to any number supplied during the call." },
        { "type": "resource", "text": "Callback verification steps (placeholder)", "url": "#", "format": "pdf", "thumb": "form", "meta": "PDF · 2 pages · checklist" },
        { "type": "steps", "text": "Callback in four steps", "items": ["Read the last two digits", "End the call", "Dial the number on file", "Verify again on answer"] }
      ],
      "answers": [
        { "label": "Succeeded", "nextNodeId": "triage-open" },
        { "label": "Failed",    "nextNodeId": "verify-refuse" }
      ]
    },
    {
      "id": "verify-refuse", "stageId": "verify", "label": "Unverified caller", "risk": null,
      "prompt": "What action is the unverified caller seeking?",
      "why": "An unverified caller can still stop the bleeding. Blocking a card only needs enough to identify it; discussing what was spent needs the full check.",
      "dialogue": [
        { "who": "customer", "text": "Forget the questions, just cancel the card." }
      ],
      "content": [
        { "type": "ask", "text": "What can and cannot be done without verification, in one sentence." },

    {

<!-- App shell. Filled entirely by render(). Nothing below holds   -->
<!-- content; the chrome labels come from UI_TEXT in the script.   -->
<!-- ============================================================ -->
<div id="app" data-role="shell"></div>

<script>
(function () {
  'use strict';

  /* ---------------------------------------------------------- */
  /* Data                                                        */
  /* ---------------------------------------------------------- */
  var FLOW = JSON.parse(document.getElementById('flow-data').textContent);
  var NODES = {};
  FLOW.nodes.forEach(function (n) { NODES[n.id] = n; });
  var STAGES = FLOW.stages.slice().sort(function (a, b) { return a.order - b.order; });
  var STAGE = {};
  STAGES.forEach(function (s) { STAGE[s.id] = s; });

  /* Chrome labels. Not scenario content, but kept in one table so the
     render functions hold no literals. Plain words: question, step, stage. */
  var UI_TEXT = {
    title: 'Fraud call guide',
    brand: 'BMO',
    searchPlaceholder: 'Find a topic…',
    searchEmpty: 'No topic matches',
    coachingToggle: 'Coaching notes',
    newCall: 'Start a new call',
    flowLabel: 'The call so far',
    stageOf: 'Stage {n} of {total}',
    back: 'Back',
    otherQuestions: 'Other topics in this stage',
    otherQuestionsHint: 'Pick one to go straight there. The steps so far are kept.',
    youAreHere: 'you are here',
    close: 'Close',
    riskLine: { elevated: 'Elevated risk', critical: 'Critical: read the guidance on the right before you speak' },
    revisit: 'You are back at step {n}. Choose the same answer to carry on, or a different one.',
    previously: 'your earlier answer',
    noneOfThese: 'None of these fit',
    later: 'Come back to this later',
    endTitle: 'End of call',
    endHint: 'Start a new call for the next customer.',
    coachingWhy: 'Why this matters',
    coachingExample: 'Example',
    speakers: { rep: 'You', customer: 'Customer' },
    feedbackLink: 'Something wrong with this step?',
    feedbackTitle: 'Feedback on this step',
    feedbackKinds: { wrong: 'Wrong', unclear: 'Unclear', missing: 'Missing a resource' },
    feedbackPlaceholder: 'What would you change?',
    feedbackSend: 'Send feedback',
    feedbackCancel: 'Cancel',
    guideTitle: 'Guidance',
    guideFor: 'For: {topic}',
    guideEmpty: 'No guidance written for this topic yet.',
    groups: { never: 'Never', escalate: 'Escalate when', ask: 'Check or ask', watch: 'Watch for', resource: 'Resources' },
    stepNotes: { later: 'Skipped for now', jumped: 'Jumped here', searched: 'Jumped here from a search', none: 'None of the answers fit', movedOn: 'Moved on without answering', resolvedLater: 'Answered later' },
    staleTitle: '{n} later step{s} no longer appl{y}',
    staleHint: 'Because the answer at step {n} changed.',
    undo: 'Undo',
    dismiss: 'Dismiss',
    keysHint: 'Keys 1 to 9 choose an answer',
    contentVersion: 'Content {v}',
    behind: 'Behind the scenes',
    behindSummary: '{visits} steps visited · {jumps} jumps · {backs} times back · {stale} times later steps dropped · {later} skipped for now · {feedback} feedback',
    behindFeedback: 'Feedback',
    behindFeedbackEmpty: 'No feedback yet.',
    behindLog: 'Event log',
    behindState: 'Current state'
  };

  /* Icon per guidance group and per document format (sprite ids). */
  var ICONS = {
    groups: { never: 'dismiss-circle', escalate: 'warning', ask: 'checkmark-circle', watch: 'search', resource: 'folder' },
    formats: { pdf: 'document-pdf', deck: 'data-bar-vertical', video: 'play', page: 'open' },
    guide: 'shield', search: 'search', risk: 'warning', end: 'checkmark', play: 'play'
  };
  var GUIDE_ORDER = ['brief', 'never', 'escalate', 'ask', 'watch', 'steps', 'resource'];

  /* ---------------------------------------------------------- */
  /* State                                                       */
  /* ---------------------------------------------------------- */
  var state = initialState();

  function initialState() {
    return {
      coaching: false,
      path: [{ nodeId: FLOW.startNodeId, arrivedVia: 'start', answer: null, status: 'open' }],
      cursor: 0,
      stale: null,
      feedback: [],
      log: [],
      ui: { stageOpen: false, feedbackOpen: false, debugOpen: false, search: '', searchOpen: false, fresh: true, intro: false }
    };
  }

  function currentStep() { return state.path[state.cursor]; }
  function currentNode() { return NODES[currentStep().nodeId]; }

  function logEvent(type, detail) {
    state.log.push({ at: new Date().toISOString(), type: type, detail: detail || {} });
  }

  /* Any forward move from a rewound position invalidates the steps after
     the cursor. They are kept as stale, shown struck through, until undone
     or dismissed. */
  function invalidateDownstream(reason) {
    if (state.cursor >= state.path.length - 1) return;
    var snap = JSON.parse(JSON.stringify({ path: state.path, cursor: state.cursor }));
    var dropped = state.path.slice(state.cursor + 1);
    state.path = state.path.slice(0, state.cursor + 1);
    state.stale = { steps: dropped, changedAt: state.cursor, reason: reason, snapshot: snap };
    logEvent('stale', { changedAt: state.cursor + 1, dropped: dropped.length, reason: reason });
  }

  function moveTo(nodeId, via) {
    state.path.push({ nodeId: nodeId, arrivedVia: via, answer: null, status: 'open' });
    state.cursor = state.path.length - 1;
    state.ui.stageOpen = false; state.ui.feedbackOpen = false; state.ui.searchOpen = false; state.ui.search = '';
    state.ui.fresh = true;
    logEvent('visit', { question: nodeId, via: via, step: state.cursor + 1 });
  }

  function leaveCurrent(newStatus) {
    var step = currentStep();
    if (step.status === 'open') step.status = newStatus;
  }

  /* ---------------------------------------------------------- */
  /* Reducer                                                     */
  /* ---------------------------------------------------------- */
  function dispatch(action) {
    var step = currentStep();
    var node = currentNode();
    var stage = STAGE[node.stageId];
    state.ui.fresh = false;
    state.ui.intro = false;

    switch (action.type) {

      case 'answer': {
        var answer = node.answers[action.index];
        if (!answer) break;
        if (state.cursor < state.path.length - 1 && step.answer === answer.label) {
          state.cursor += 1;
          state.ui.fresh = true;
          logEvent('forward', { step: state.cursor + 1 });
          break;
        }
        invalidateDownstream('answer-changed');
        step.answer = answer.label; step.status = 'answered';
        state.path.forEach(function (s) { if (s !== step && s.nodeId === node.id && s.status === 'later') s.status = 'resolved-later'; });
        logEvent('answer', { question: node.id, answer: answer.label });
        moveTo(answer.nextNodeId, 'answer');
        break;
      }

      case 'none-of-these': {
        invalidateDownstream('none-of-these');
        step.status = 'none'; step.answer = null;
        logEvent('none-of-these', { question: node.id });
        moveTo(stage.noneOfTheseNodeId, 'none');
        break;
      }

      case 'later': {
        invalidateDownstream('later');
        step.status = 'later'; step.answer = null;
        logEvent('later', { question: node.id });
        moveTo(stage.skipToNodeId, 'later');
        break;
      }

      case 'jump': {
        if (action.nodeId === node.id) { state.ui.stageOpen = false; break; }
        invalidateDownstream('jump');
        leaveCurrent('moved-on');
        logEvent('jump', { from: node.id, to: action.nodeId, via: action.via });
        moveTo(action.nodeId, action.via);
        break;
      }

      case 'rewind': {
        if (action.index === state.cursor || action.index < 0 || action.index >= state.path.length) break;
        logEvent('back', { from: state.cursor + 1, to: action.index + 1 });
        state.cursor = action.index;
        state.ui.stageOpen = false; state.ui.feedbackOpen = false;
        state.ui.fresh = true;
        break;
      }

      case 'undo-stale': {
        if (!state.stale) break;
        state.path = state.stale.snapshot.path; state.cursor = state.stale.snapshot.cursor;
        state.stale = null;
        state.ui.fresh = true;
        logEvent('undo', { backTo: state.cursor + 1 });
        break;
      }

      case 'dismiss-stale': {
        if (!state.stale) break;
        logEvent('stale-dismissed', { dropped: state.stale.steps.length });
        state.stale = null;
        break;
      }

      case 'toggle-coaching': { state.coaching = !state.coaching; logEvent('coaching', { on: state.coaching }); break; }
      case 'toggle-stage': { state.ui.stageOpen = !state.ui.stageOpen; state.ui.feedbackOpen = false; break; }
      case 'toggle-feedback': { state.ui.feedbackOpen = !state.ui.feedbackOpen; state.ui.stageOpen = false; break; }
      case 'send-feedback': {
        state.feedback.push({ id: state.feedback.length + 1, question: node.id, kind: action.kind, comment: action.comment, at: new Date().toISOString() });
        state.ui.feedbackOpen = false;
        logEvent('feedback', { question: node.id, kind: action.kind });
        break;
      }

      case 'search': { state.ui.search = action.value; state.ui.searchOpen = action.value.trim().length > 0; break; }
      case 'toggle-debug': { state.ui.debugOpen = !state.ui.debugOpen; break; }
      case 'close-panels': { state.ui.stageOpen = false; state.ui.feedbackOpen = false; state.ui.searchOpen = false; break; }

      case 'reset': {
        var keep = { coaching: state.coaching, feedback: state.feedback, log: state.log };
        state = initialState();
        state.coaching = keep.coaching; state.feedback = keep.feedback; state.log = keep.log;
        logEvent('new-call', {});
        break;
      }
    }
    render();
  }

  /* ---------------------------------------------------------- */
  /* Derived                                                     */
  /* ---------------------------------------------------------- */
  function searchNodes(query) {
    var q = query.trim().toLowerCase();
    if (!q) return [];
    return FLOW.nodes.filter(function (n) {
      var hay = [n.label, n.prompt, STAGE[n.stageId].label].concat(n.content.map(function (c) { return c.text; })).join(' ').toLowerCase();
      return hay.indexOf(q) >= 0;
    }).slice(0, 10);
  }

  function counts() {
    var c = { visits: 0, jumps: 0, backs: 0, stale: 0, later: 0, feedback: 0 };
    state.log.forEach(function (e) {
      if (e.type === 'visit') c.visits += 1;
      if (e.type === 'jump') c.jumps += 1;
      if (e.type === 'back') c.backs += 1;
      if (e.type === 'stale') c.stale += 1;
      if (e.type === 'later') c.later += 1;
      if (e.type === 'feedback') c.feedback += 1;
    });
    return c;
  }

  /* ---------------------------------------------------------- */
  /* Render: state in, DOM out. One call per dispatch.           */
  /* ---------------------------------------------------------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  /* Escaped text with **bold** spans: the only markup content may carry. */
  function rich(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
  function fmt(tpl, vars) { return tpl.replace(/\{(\w+)\}/g, function (_, k) { return vars[k] != null ? vars[k] : ''; }); }
  function attr(name, v) { return v == null || v === false ? '' : ' ' + name + '="' + esc(v) + '"'; }
  function icon(name) { return '<svg class="icon" aria-hidden="true" focusable="false"><use href="#ic-fluent-' + name + '-24-regular"></use></svg>'; }

  function render() {
    var root = document.getElementById('app');
    var focus = captureFocus();
    root.innerHTML = renderTop() + renderFlow() + renderGuide() + renderFoot();
    restoreFocus(focus);
    if (state.ui.fresh && !state.ui.intro) {   // first paint keeps the header in view
      var card = root.querySelector('[data-role="question-card"]');
      if (card && card.scrollIntoView) card.scrollIntoView({ block: 'nearest' });
    }
  }

  function captureFocus() {
    var el = document.activeElement;
    var key = el && el.getAttribute ? el.getAttribute('data-focus-key') : null;
    return key ? { key: key, start: el.selectionStart, end: el.selectionEnd } : null;
  }
  function restoreFocus(f) {
    if (!f) return;
    var el = document.querySelector('[data-role="' + f.key + '"]');
    if (!el) return;
    el.focus();
    if (typeof f.start === 'number' && el.setSelectionRange) { try { el.setSelectionRange(f.start, f.end); } catch (e) {} }
  }

  /* ---- top: the brand header, then the toolbar floating over its edge ---- */
  function renderTop() {
    var intro = state.ui.intro ? 'true' : null;
    return '<header data-role="top">' +
      '<div data-role="brand-bar"' + attr('data-intro', intro) + '>' +
      '<div data-role="hero-photo" aria-hidden="true"></div>' +
      '<svg data-role="roundel" role="img"' + attr('aria-label', UI_TEXT.brand) + '><use href="#bmo-roundel"></use></svg>' +
      '<div data-role="brand-text"><h1>' + esc(UI_TEXT.title) + '</h1><p>' + esc(FLOW.meta.scenario) + '</p></div>' +
      '</div>' +
      '<div data-role="header-row"' + attr('data-intro', intro) + '>' +
      renderSearch() +
      '<span class="spacer"></span>' +
      '<button type="button" class="btn-toggle" data-action="toggle-coaching" data-role="coaching-toggle"' + attr('aria-pressed', state.coaching ? 'true' : 'false') + '>' + esc(UI_TEXT.coachingToggle) + '</button>' +
      '<button type="button" class="btn-dark" data-action="reset" data-role="new-call">' + esc(UI_TEXT.newCall) + '</button>' +
      '</div></header>';
  }

  function renderSearch() {
    var results = state.ui.searchOpen ? searchNodes(state.ui.search) : [];
    var h = '<div data-role="search" role="search">' + icon(ICONS.search);
    h += '<input type="search" data-role="search-input" data-focus-key="search-input" autocomplete="off"' +
      attr('placeholder', UI_TEXT.searchPlaceholder) + attr('value', state.ui.search) + attr('aria-label', UI_TEXT.searchPlaceholder) + '>';
    if (state.ui.searchOpen) {
      h += '<div data-role="search-results">';
      if (!results.length) h += '<div class="search-empty">' + esc(UI_TEXT.searchEmpty) + '</div>';
      results.forEach(function (n) {
        h += '<button type="button" data-role="search-result" data-action="jump" data-via="searched"' + attr('data-node-id', n.id) + '>' +
          esc(n.label) + '<span>' + esc(STAGE[n.stageId].label) + '</span></button>';
      });
      h += '</div>';
    }
    return h + '</div>';
  }

  /* ---- the flow: stage labels, step boxes, labelled edges, the card ---- */
  function renderFlow() {
    var h = '<main data-role="path"' + attr('aria-label', UI_TEXT.flowLabel) + '><ol data-role="flow">';
    var lastStage = null;
    var items = state.path.map(function (step, i) { return { step: step, i: i, state: i === state.cursor ? 'current' : (i < state.cursor ? 'past' : 'ahead') }; });
    if (state.stale) state.stale.steps.forEach(function (step, j) { items.push({ step: step, i: state.stale.changedAt + 1 + j, state: 'stale', firstStale: j === 0 }); });

    items.forEach(function (it, k) {
      var node = NODES[it.step.nodeId];
      var prev = k > 0 ? items[k - 1] : null;
      if (it.firstStale) h += '<li>' + renderStaleNotice() + '</li>';
      if (prev) h += renderEdge(prev.step, it.state === 'past' ? 'past' : it.state);
      if (node.stageId !== lastStage && it.state !== 'stale') {
        h += renderStageLabel(STAGE[node.stageId], it.state === 'current' ? 'current' : it.state);
        lastStage = node.stageId;
      }
      if (it.state === 'current') h += '<li data-role="step" data-state="current">' + renderQuestionCard(it.step, it.i) + '</li>';
      else h += renderStepBox(it.step, it.i, it.state);
    });

    // the stages still to come, faint, so the road ahead is visible
    var currentOrder = STAGE[currentNode().stageId].order;
    STAGES.filter(function (s) { return s.order > currentOrder; }).forEach(function (s) {
      h += renderStageLabel(s, 'ahead');
    });
    return h + '</ol></main>';
  }

  function renderStageLabel(stage, st) {
    var idx = STAGES.indexOf(stage);
    return '<li data-role="stage-label"' + attr('data-state', st) + attr('data-stage-id', stage.id) + '>' +
      '<span>' + esc(fmt(UI_TEXT.stageOf, { n: idx + 1, total: STAGES.length })) + ' · ' + esc(stage.label) + '</span></li>';
  }

  /* the connector between two boxes carries what was chosen at the upper one */
  function renderEdge(prevStep, st) {
    var text = prevStep.answer || '';
    return '<li data-role="edge"' + attr('data-state', st) + '>' + (text ? '<span>' + esc(text) + '</span>' : '') + '</li>';
  }

  function stepNote(step) {
    if (step.status === 'later') return UI_TEXT.stepNotes.later;
    if (step.status === 'resolved-later') return UI_TEXT.stepNotes.resolvedLater;
    if (step.status === 'none') return UI_TEXT.stepNotes.none;
    if (step.status === 'moved-on') return UI_TEXT.stepNotes.movedOn;
    return '';
  }
  function arrivalNote(step) {
    if (step.arrivedVia === 'jumped') return UI_TEXT.stepNotes.jumped;
    if (step.arrivedVia === 'searched') return UI_TEXT.stepNotes.searched;
    return '';
  }

  function renderStepBox(step, i, stateName) {
    var n = NODES[step.nodeId];
    var notes = [arrivalNote(step), stepNote(step)].filter(Boolean).join(' · ');
    var clickable = stateName !== 'stale';
    return '<li data-role="step"' + attr('data-state', stateName) + attr('data-node-id', n.id) + '>' +
      '<button type="button" data-role="step-box" data-action="rewind"' + attr('data-index', clickable ? i : null) + (clickable ? '' : ' disabled') + '>' +
      '<strong>' + (i + 1) + '. ' + esc(n.label) + '</strong>' +
      (notes ? '<span class="step-note">' + esc(notes) + '</span>' : '') +
      '</button></li>';
  }

  function renderStaleNotice() {
    var n = state.stale.steps.length;
    return '<div data-role="stale-notice" role="status">' +
      '<strong>' + esc(fmt(UI_TEXT.staleTitle, { n: n, s: n === 1 ? '' : 's', y: n === 1 ? 'ies' : 'y' })) + '</strong>' +
      '<span class="muted">' + esc(fmt(UI_TEXT.staleHint, { n: state.stale.changedAt + 1 })) + '</span>' +
      '<span class="row"><button type="button" class="btn-dark" data-action="undo-stale" data-role="stale-undo">' + esc(UI_TEXT.undo) + '</button>' +
      '<button type="button" data-action="dismiss-stale" data-role="stale-dismiss">' + esc(UI_TEXT.dismiss) + '</button></span></div>';
  }

  function renderQuestionCard(step, i) {
    var node = NODES[step.nodeId];
    var stage = STAGE[node.stageId];
    var revisiting = state.cursor < state.path.length - 1;
    var h = '<article data-role="question-card"' + attr('data-node-id', node.id) + attr('data-risk', node.risk) + attr('data-fresh', state.ui.fresh ? 'true' : null) + '>';
    h += '<div class="card-top"><span>' + (i + 1) + '. ' + esc(node.label) + '</span>' +
      (arrivalNote(step) ? '<span class="muted">· ' + esc(arrivalNote(step)) + '</span>' : '') +
      '<span class="spacer"></span>' +
      (i > 0 ? '<button type="button" class="btn-text" data-action="rewind" data-role="back"' + attr('data-index', i - 1) + '>' + esc(UI_TEXT.back) + '</button>' : '') +
      '<button type="button" class="btn-text" data-action="toggle-stage" data-role="other-questions"' + attr('aria-expanded', state.ui.stageOpen ? 'true' : 'false') + '>' + esc(UI_TEXT.otherQuestions) + '</button>' +
      '</div>';
    if (node.risk === 'elevated' || node.risk === 'critical') h += '<div data-role="risk-line"' + attr('data-risk', node.risk) + '>' + icon(ICONS.risk) + '<span>' + esc(UI_TEXT.riskLine[node.risk]) + '</span></div>';
    h += '<h2 data-role="prompt">' + esc(node.prompt) + '</h2>';
    if (revisiting) h += '<p data-role="revisit-line">' + esc(fmt(UI_TEXT.revisit, { n: i + 1 })) + '</p>';

    if (node.terminal) {
      h += '<div data-role="end-card"><span class="badge">' + icon(ICONS.end) + '</span><div><h3>' + esc(UI_TEXT.endTitle) + '</h3><p>' + esc(UI_TEXT.endHint) + '</p>' +
        '<button type="button" class="btn-dark" data-action="reset">' + esc(UI_TEXT.newCall) + '</button></div></div>';
    } else {
      h += '<div data-role="fork"><div data-role="answers"' + attr('data-count', node.answers.length) + '>';
      node.answers.forEach(function (a, k) {
        var prev = revisiting && step.answer === a.label;
        h += '<button type="button" data-role="answer" data-action="answer"' + attr('data-index', k) + attr('data-previous', prev ? 'true' : null) + '>' +
          '<span>' + esc(a.label) + '</span>' + (prev ? '<span class="prev">' + esc(UI_TEXT.previously) + '</span>' : '') + '</button>';
      });
      h += '</div></div>';
      h += '<div data-role="other-ways">';
      if (node.id !== stage.noneOfTheseNodeId) h += '<button type="button" class="btn-text" data-action="none-of-these" data-role="none-of-these">' + esc(UI_TEXT.noneOfThese) + '</button>';
      h += '<button type="button" class="btn-text" data-action="later" data-role="later">' + esc(UI_TEXT.later) + '</button>';
      h += '</div>';
    }

    if (state.ui.stageOpen) h += renderStageQuestions(node, stage);

    if (state.coaching && (node.why || (node.dialogue && node.dialogue.length))) {
      h += '<div data-role="coaching">';
      if (node.why) h += '<section><h3>' + esc(UI_TEXT.coachingWhy) + '</h3><p>' + esc(node.why) + '</p></section>';
      if (node.dialogue && node.dialogue.length) {
        h += '<section><h3>' + esc(UI_TEXT.coachingExample) + '</h3><ul data-role="dialogue">';
        node.dialogue.forEach(function (d) { h += '<li' + attr('data-who', d.who) + '><span class="who">' + esc(UI_TEXT.speakers[d.who] || d.who) + '</span>' + esc(d.text) + '</li>'; });
        h += '</ul></section>';
      }
      h += '</div>';
    }

    if (state.ui.feedbackOpen) h += renderFeedbackForm();
    else h += '<p data-role="feedback-row"><button type="button" class="btn-text small" data-action="toggle-feedback" data-role="feedback-link">' + esc(UI_TEXT.feedbackLink) + '</button></p>';

    return h + '</article>';
  }

  function renderStageQuestions(node, stage) {
    var h = '<section data-role="stage-questions">';
    h += '<header><h3>' + esc(stage.label) + '</h3>' +
      '<button type="button" class="btn-text" data-action="toggle-stage">' + esc(UI_TEXT.close) + '</button></header>' +
      '<p class="muted">' + esc(UI_TEXT.otherQuestionsHint) + '</p><ul>';
    FLOW.nodes.filter(function (n) { return n.stageId === stage.id; }).forEach(function (n) {
      var here = n.id === node.id;
      h += '<li><button type="button" data-role="stage-question" data-action="jump" data-via="jumped"' + attr('data-node-id', n.id) + attr('aria-current', here ? 'true' : null) + (here ? ' disabled' : '') + '>' +
        '<span class="risk-mark"' + attr('data-risk', n.risk) + '></span><span>' + esc(n.label) + (here ? ' <span class="muted">(' + esc(UI_TEXT.youAreHere) + ')</span>' : '') + '</span></button></li>';
    });
    return h + '</ul></section>';
  }

  function renderFeedbackForm() {
    var h = '<form data-role="feedback-form" data-action="send-feedback"><h3>' + esc(UI_TEXT.feedbackTitle) + '</h3><fieldset>';
    Object.keys(UI_TEXT.feedbackKinds).forEach(function (k, i) {
      h += '<label><input type="radio" name="kind"' + attr('value', k) + (i === 0 ? ' checked' : '') + '> ' + esc(UI_TEXT.feedbackKinds[k]) + '</label>';
    });
    h += '</fieldset><textarea name="comment" rows="2"' + attr('placeholder', UI_TEXT.feedbackPlaceholder) + '></textarea>';
    h += '<div class="row"><button type="submit" class="btn-dark">' + esc(UI_TEXT.feedbackSend) + '</button>' +
      '<button type="button" class="btn-text" data-action="toggle-feedback">' + esc(UI_TEXT.feedbackCancel) + '</button></div></form>';
    return h;
  }

  /* ---- guidance: the right half ---- */
  function renderGuide() {
    var node = currentNode();
    var h = '<aside data-role="guide"' + attr('data-fresh', state.ui.fresh ? 'true' : null) + '>' +
      '<header data-role="guide-head"><span class="badge">' + icon(ICONS.guide) + '</span><div><h2>' + esc(UI_TEXT.guideTitle) + '</h2><p>' + esc(fmt(UI_TEXT.guideFor, { topic: node.label })) + '</p></div></header>' +
      '<div data-role="guide-body">';
    var any = false;
    GUIDE_ORDER.forEach(function (type) {
      var blocks = node.content.filter(function (c) { return c.type === type; });
      if (!blocks.length) return;
      any = true;
      if (type === 'brief') { blocks.forEach(function (b) { h += renderBrief(b); }); return; }
      if (type === 'steps') { blocks.forEach(function (b) { h += renderSteps(b); }); return; }
      h += '<section data-role="guide-group"' + attr('data-type', type) + '><h3>' + icon(ICONS.groups[type]) + '<span>' + esc(UI_TEXT.groups[type]) + '</span></h3><ul>';
      blocks.forEach(function (b) {
        h += '<li data-role="guide-item">' + (type === 'resource' ? renderDoc(b) : icon(ICONS.groups[type]) + '<span>' + rich(b.text) + '</span>') + '</li>';
      });
      h += '</ul></section>';
    });
    if (!any) h += '<p data-role="guide-empty">' + esc(UI_TEXT.guideEmpty) + '</p>';
    return h + '</div></aside>';
  }

  /* a formatted brief: heading, paragraph, bullets */
  function renderBrief(b) {
    var h = '<section data-role="guide-brief"><h3>' + esc(b.text) + '</h3>';
    if (b.body) h += '<p>' + rich(b.body) + '</p>';
    if (b.points && b.points.length) {
      h += '<ul>';
      b.points.forEach(function (p) { h += '<li>' + rich(p) + '</li>'; });
      h += '</ul>';
    }
    return h + '</section>';
  }

  /* a step graphic: numbered circles joined by a line */
  function renderSteps(b) {
    var h = '<section data-role="guide-steps"><h3>' + esc(b.text) + '</h3><ol>';
    (b.items || []).forEach(function (s, k) { h += '<li><span class="num">' + (k + 1) + '</span><span>' + esc(s) + '</span></li>'; });
    return h + '</ol></section>';
  }

  /* a resource as a document card: drawn thumbnail, title, format line */
  function renderDoc(b) {
    var h = '<a data-role="doc"' + attr('href', b.url || '#') + attr('data-format', b.format) + '>';
    if (b.format) h += renderThumb(b.format, b.thumb);
    h += '<span class="doc-body"><span class="doc-title">' + esc(b.text) + '</span>';
    if (b.meta) h += '<span class="doc-meta">' + icon(ICONS.formats[b.format] || ICONS.formats.page) + '<span>' + esc(b.meta) + '</span></span>';
    return h + '</span></a>';
  }

  function lines(n, shortLast) {
    var h = '';
    for (var k = 0; k < n; k++) h += '<i class="t-line' + (shortLast && k === n - 1 ? ' t-short' : '') + '"></i>';
    return h;
  }

  /* Thumbnails are structure only: no text, so nothing is under 14px. */
  function renderThumb(format, variant) {
    var inner;
    if (format === 'video') {
      inner = '<span class="t-video"><i class="t-play">' + icon(ICONS.play) + '</i><i class="t-progress"></i></span>';
    } else if (format === 'deck') {
      var body = variant === 'steps' ? '<span class="t-steps"><i></i><i></i><i></i></span>'
        : variant === 'split' ? '<i class="t-pic"></i><span class="t-col">' + lines(4, true) + '</span>'
        : '<span class="t-col">' + lines(4, true) + '</span><span class="t-chart"><i></i><i></i><i></i><i></i></span>';
      inner = '<span class="slide"><i class="t-title"></i><span class="t-body">' + body + '</span></span>';
    } else if (format === 'page') {
      inner = '<span class="frame"><span class="t-chrome"><i></i><i></i><i></i></span><i class="t-band"></i><span class="t-inner">' +
        (variant === 'search' ? '<i class="t-search"></i>' + lines(3, true) : '<span class="t-table">' + new Array(13).join('<i></i>') + '</span>') + '</span></span>';
    } else {
      var pageBody = variant === 'table' ? '<span class="t-table">' + new Array(16).join('<i></i>') + '</span>'
        : variant === 'form' ? '<span class="t-form">' + new Array(7).join('<i></i>') + '</span>'
        : lines(9, true);
      inner = '<span class="page"><i class="t-title"></i>' + pageBody + '</span>';
    }
    return '<span class="thumb" aria-hidden="true"' + attr('data-format', format) + attr('data-thumb', variant) + '>' + inner + '</span>';
  }

  /* ---- footer and behind the scenes ---- */
  function renderFoot() {
    var h = '<footer data-role="foot"><span>' + esc(UI_TEXT.keysHint) + '</span><span>' + esc(fmt(UI_TEXT.contentVersion, { v: FLOW.meta.contentVersion })) + '</span><span class="spacer"></span>' +
      '<button type="button" class="btn-text small" data-action="toggle-debug" data-role="debug-toggle"' + attr('aria-expanded', state.ui.debugOpen ? 'true' : 'false') + '>' + esc(UI_TEXT.behind) + (state.feedback.length ? ' (' + state.feedback.length + ')' : '') + '</button>';
    if (state.ui.debugOpen) h += renderDebug();
    return h + '</footer>';
  }

  function renderDebug() {
    var c = counts();
    var h = '<section data-role="debug"><p>' + esc(fmt(UI_TEXT.behindSummary, c)) + '</p>';
    h += '<h3>' + esc(UI_TEXT.behindFeedback) + '</h3>';
    if (!state.feedback.length) h += '<p class="muted">' + esc(UI_TEXT.behindFeedbackEmpty) + '</p>';
    else {
      h += '<ul data-role="feedback-list">';
      state.feedback.forEach(function (f) {
        h += '<li><strong>' + esc(NODES[f.question].label) + '</strong> · ' + esc(UI_TEXT.feedbackKinds[f.kind]) + (f.comment ? '<br>' + esc(f.comment) : '') + '<br><span class="muted small">' + esc(f.question) + ' · ' + esc(f.at) + '</span></li>';
      });
      h += '</ul>';
    }
    h += '<h3>' + esc(UI_TEXT.behindLog) + '</h3><ol data-role="event-log">';
    state.log.slice().reverse().forEach(function (e) {
      h += '<li><span class="muted">' + esc(e.at.slice(11, 23)) + '</span><span class="ev-type">' + esc(e.type) + '</span><span>' + esc(JSON.stringify(e.detail)) + '</span></li>';
    });
    h += '</ol>';
    var view = { cursor: state.cursor, path: state.path, stale: state.stale ? { changedAt: state.stale.changedAt, reason: state.stale.reason, steps: state.stale.steps } : null, coaching: state.coaching };
    h += '<h3>' + esc(UI_TEXT.behindState) + '</h3><pre data-role="state-json">' + esc(JSON.stringify(view, null, 2)) + '</pre>';
    return h + '</section>';
  }

  /* ---------------------------------------------------------- */
  /* Events: delegated; handlers only translate to actions       */
  /* ---------------------------------------------------------- */
  var root = document.getElementById('app');

  root.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]');
    if (!el || el.tagName === 'FORM') return;
    var action = el.getAttribute('data-action');
    switch (action) {
      case 'answer': dispatch({ type: 'answer', index: Number(el.getAttribute('data-index')) }); break;
      case 'jump': dispatch({ type: 'jump', nodeId: el.getAttribute('data-node-id'), via: el.getAttribute('data-via') }); break;
      case 'rewind': if (el.hasAttribute('data-index')) dispatch({ type: 'rewind', index: Number(el.getAttribute('data-index')) }); break;
      default: dispatch({ type: action }); break;
    }
  });

  root.addEventListener('input', function (ev) {
    if (ev.target.getAttribute('data-role') === 'search-input') dispatch({ type: 'search', value: ev.target.value });
  });

  root.addEventListener('submit', function (ev) {
    var form = ev.target.closest('form[data-action="send-feedback"]');
    if (!form) return;
    ev.preventDefault();
    var kind = form.querySelector('input[name="kind"]:checked');
    dispatch({ type: 'send-feedback', kind: kind ? kind.value : Object.keys(UI_TEXT.feedbackKinds)[0], comment: form.querySelector('textarea[name="comment"]').value.trim() });
  });

  root.addEventListener('keydown', function (ev) {
    if (ev.target.getAttribute && ev.target.getAttribute('data-role') === 'search-input' && ev.key === 'Enter') {
      var first = searchNodes(state.ui.search)[0];
      if (first) { ev.preventDefault(); dispatch({ type: 'jump', nodeId: first.id, via: 'searched' }); }
    }
  });

  document.addEventListener('keydown', function (ev) {
    var t = ev.target;
    var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
    if (ev.key === 'Escape') { if (typing) t.blur(); dispatch({ type: 'close-panels' }); return; }
    if (typing) return;
    if (/^[1-9]$/.test(ev.key) && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
      var node = currentNode();
      var i = Number(ev.key) - 1;
      if (!node.terminal && node.answers[i]) { ev.preventDefault(); dispatch({ type: 'answer', index: i }); }
    }
  });

  logEvent('visit', { question: FLOW.startNodeId, via: 'start', step: 1 });
  state.ui.intro = true;   // the header's one-time entrance, on first paint only
  render();

  // Exposed for the smoke test and for poking at in the console.
  window.__frd = { getState: function () { return JSON.parse(JSON.stringify(state)); }, flow: FLOW, dispatch: dispatch };
})();
</script>
</body>
</html>
